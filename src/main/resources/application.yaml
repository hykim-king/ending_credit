spring:
  application:
    name: ending_credit

  # --------------------------------------
  # Thymeleaf
  # 개발: cache: false
  # --------------------------------------
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

# --------------------------------------
# Mybatis
# --------------------------------------
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.endit.domain

  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# --------------------------------------
# server
# --------------------------------------
server:
  port: 8080

# --------------------------------------
# logging
# --------------------------------------
logging:
  level:
    root: info
    com.endit: INFO

  file:
    name: logs/application.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
