<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>관리자 대시보드</title>
</head>
<body>
<div layout:fragment="content">

<div class="d-flex gap-3">
    <aside th:replace="~{fragments/admin_side :: admin_side('dashboard')}">side</aside>

    <div class="flex-grow-1">
        <div class="d-flex justify-content-between align-items-end mb-3">
            <h4 class="fw-bold mb-0">대시보드</h4>
            <span class="filter-bar text-muted">임시 조회 화면 — 담당 조 구현 시 대체</span>
        </div>

        <!--핵심: 미처리 신고 (4조 정식 기능으로 연결)-->
        <a th:href="@{/report/doRetrieve}" class="text-decoration-none">
            <div class="comment-card mb-3 d-flex align-items-center gap-3">
                <span class="avatar-circle"><i class="bi bi-flag"></i></span>
                <div>
                    <div class="filter-bar text-muted">미처리 신고 (접수·처리 중)</div>
                    <div class="fs-3 fw-bold" th:text="${summary['REPORT_OPEN_CNT']}">0</div>
                </div>
                <span class="ms-auto filter-bar">신고 관리로 이동 →</span>
            </div>
        </a>

        <!--집계 카드-->
        <div class="row g-3">
            <div class="col-6 col-md-4">
                <div class="comment-card">
                    <div class="filter-bar text-muted">영화</div>
                    <div class="fs-4 fw-bold" th:text="${summary['CONTENT_CNT']}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="comment-card">
                    <div class="filter-bar text-muted">인물</div>
                    <div class="fs-4 fw-bold" th:text="${summary['PERSON_CNT']}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="comment-card">
                    <div class="filter-bar text-muted">회원</div>
                    <div class="fs-4 fw-bold" th:text="${summary['MEMBER_CNT']}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="comment-card">
                    <div class="filter-bar text-muted">컬렉션</div>
                    <div class="fs-4 fw-bold" th:text="${summary['COLLECTION_CNT']}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="comment-card">
                    <div class="filter-bar text-muted">코멘트</div>
                    <div class="fs-4 fw-bold" th:text="${summary['COMMENT_CNT']}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="comment-card">
                    <div class="filter-bar text-muted">신고 전체</div>
                    <div class="fs-4 fw-bold" th:text="${summary['REPORT_CNT']}">0</div>
                </div>
            </div>
        </div>
    </div>
</div>

</div>
</body>
</html>
