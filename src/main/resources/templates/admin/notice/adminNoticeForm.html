<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">

    <title th:text="${isEdit ? '공지 수정' : '공지 등록'}">
        공지 등록·수정
    </title>
</head>

<body data-page="admin-notice-form"
      th:attr="data-notice-id=${notice.noticeId}">

<div layout:fragment="content">

    <div class="d-flex gap-3">

        <!-- 관리자 사이드 메뉴 -->
        <aside th:replace="~{fragments/admin_side :: admin_side('notices')}">
            side
        </aside>

        <!-- 공지 등록 / 수정 영역 -->
        <div class="flex-grow-1">

            <h4 class="fw-bold mb-3"
                th:text="${isEdit ? '공지 수정' : '공지 등록'}">
                공지 등록·수정
            </h4>

            <form id="noticeForm"
                  class="comment-card">

                <!-- 제목 -->
                <div class="mb-3">

                    <label for="title"
                           class="form-label fw-bold">
                        제목 *
                    </label>

                    <input id="title"
                           name="title"
                           type="text"
                           class="form-control"
                           maxlength="200"
                           required
                           placeholder="공지 제목"
                           th:value="${notice.title}">

                </div>


                <!-- 본문 -->
                <div class="mb-3">

                    <label for="content"
                           class="form-label fw-bold">
                        본문 *
                    </label>

                    <textarea id="content"
                              name="content"
                              class="form-control"
                              rows="11"
                              required
                              placeholder="공지 내용을 입력합니다."
                              th:text="${notice.content}">
                    </textarea>

                </div>


 <!-- 오류 메시지 -->
<div id="formError"
     class="alert alert-danger py-2"
     hidden>
</div>


<!-- 중요 공지 + 하단 버튼 -->
<div class="d-flex justify-content-between align-items-end gap-3 flex-wrap mt-3">

    <!-- 왼쪽 : 중요 공지 -->
    <div>

        <label class="form-label fw-bold">
            중요 공지
        </label>

        <div class="d-flex gap-2">

            <input type="radio"
                   class="btn-check"
                   name="important"
                   id="importantY"
                   value="Y"
                   autocomplete="off"
                   th:checked="${notice.important == 'Y'}">

            <label class="btn btn-outline-primary"
                   for="importantY">
                Y
            </label>


            <input type="radio"
                   class="btn-check"
                   name="important"
                   id="importantN"
                   value="N"
                   autocomplete="off"
                   th:checked="${notice.important == 'N'}">

            <label class="btn btn-outline-primary"
                   for="importantN">
                N
            </label>

        </div>

    </div>


    <!-- 오른쪽 : 삭제 / 취소 / 저장 -->
    <div class="d-flex gap-2 ms-auto">

        <button type="button"
                id="deleteButton"
                class="btn btn-outline-danger"
                th:if="${isEdit}">
            삭제
        </button>

        <button type="button"
                id="cancelButton"
                class="btn btn-outline-secondary">
            취소
        </button>

        <button type="submit"
                id="saveButton"
                class="btn btn-primary">
            저장
        </button>

    </div>

</div>

    <script th:src="@{/assets/js/notice/notice.js}"
            defer>
    </script>

</div>

</body>
</html>
