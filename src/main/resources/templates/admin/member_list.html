<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>회원 관리</title>
</head>
<body>
<div layout:fragment="content">

<div class="d-flex gap-3">
    <aside th:replace="~{fragments/admin_side :: admin_side('member')}">side</aside>

    <div class="flex-grow-1">
        <div class="d-flex justify-content-between align-items-end mb-3">
            <h4 class="fw-bold mb-0">회원 관리 목록</h4>
            <span class="filter-bar text-muted">임시 조회 전용 — 2조 구현 시 대체</span>
        </div>

        <table class="table table-sm table-hover align-middle admin-table bg-white">
            <thead>
                <tr>
                    <th style="width:8%;">ID</th>
                    <th>이메일</th>
                    <th style="width:20%;">닉네임</th>
                    <th style="width:10%;">역할</th>
                    <th style="width:14%;">가입일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="5" class="text-center text-muted py-4">데이터가 없습니다.</td>
                </tr>
                <tr th:each="row : ${rows}">
                    <td th:text="${row['MEMBER_ID']}">1</td>
                    <td th:text="${row['EMAIL']}">user@endit.com</td>
                    <td th:text="${row['NICKNAME']}">닉네임</td>
                    <td th:text="${row['ROLE']}">USER</td>
                    <td th:text="${row['CREATED_DT']}">2026/08/25</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</div>
</body>
</html>
