<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}"
>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인</title>
</head>
<body>    
    <!--container-->
    <div layout:fragment="content" 
    class="container py-2" style="max-width: 400px;" >
        
    <h3 class="display-7 mb-4 ">
        <i class="bi bi-modem"></i>
        로그인  
    </h3>
    <!-- 로그인 실패 -->
    <div class="alert alert-danger"
      th:if="${param.error}"
      th:text="${param.message}"
    >아이디 또는 비번을 확인하세요.**</div>
    
    <form th:action="@{/login/login}"  method="post">
        <div class="mb-3">
            <label for="userId" class="form-label">
                아이디
            </label>
            <input type="text" 
                name="userId" 
                id="userId" 
                class="form-control"
                placeholder="아이디를 입력하세요"
                max="30"
                required="required"
            />
        </div>    
        <div class="mb-3">
            <label for="password" class="form-label">
                비밀번호
            </label>
            <input type="password" 
                name="password" 
                id="password" 
                class="form-control"
                placeholder="비밀번호를 입력하세요"
                max="30"
                required="required"
            />
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>         
    </form>
    </div>   
    <!--//container--> 
</body>
</html>
