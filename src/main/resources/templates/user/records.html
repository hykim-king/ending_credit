<!DOCTYPE html>
<!--
Modification History
2026. 8. 31. jinyoung - 회원 목록 공통 UI 스크립트 적용
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원 기록</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<!-- 회원 번호와 최초 탭은 View Controller가 전달하고 목록 데이터는 REST API로 조회한다. -->
<body class="bg-light"
      th:attr="data-member-id=${memberId},data-initial-tab=${tab}">

    <header class="border-bottom bg-white">
        <div class="container py-3 d-flex justify-content-between align-items-center">
            <a class="text-decoration-none text-dark fs-4 fw-bold" th:href="@{/}">
                Ending Credit
            </a>
            <a class="btn btn-outline-dark"
               th:href="@{/users/{id}(id=${memberId})}">
                프로필로 돌아가기
            </a>
        </div>
    </header>

    <main class="container py-4">
        <section class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <p class="text-secondary mb-1">프로필 기록</p>
                <h1 class="h3 mb-0"
                    th:text="|회원 #${memberId}의 영화 기록|">
                    회원의 영화 기록
                </h1>
            </div>
        </section>

        <!-- U-03~U-06은 별도 페이지가 아니라 같은 화면 안에서 탭으로 전환한다. -->
        <nav class="mb-4" aria-label="회원 기록 유형">
            <div id="recordTabs" class="nav nav-tabs">
                <a id="ratingsTab"
                   class="nav-link"
                   data-tab="ratings"
                   th:href="@{/users/{id}/records(id=${memberId},tab='ratings')}">
                    평가
                </a>
                <a class="nav-link disabled"
                   href="#"
                   tabindex="-1"
                   aria-disabled="true"
                   title="코멘트 API 연동 후 제공">
                    코멘트
                </a>
                <a class="nav-link disabled"
                   href="#"
                   tabindex="-1"
                   aria-disabled="true"
                   title="컬렉션 API 연동 후 제공">
                    컬렉션
                </a>
                <a id="watchlistTab"
                   class="nav-link"
                   data-tab="watchlist"
                   th:href="@{/users/{id}/records(id=${memberId},tab='watchlist')}">
                    보고싶어요
                </a>
            </div>
        </nav>

        <section class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex flex-column flex-sm-row justify-content-between
                            align-items-sm-center gap-3 mb-4">
                    <div>
                        <h2 id="recordTitle" class="h4 mb-1">평가한 영화</h2>
                        <span id="recordTotalCount" class="text-secondary small">0개</span>
                    </div>

                    <!-- 현재 산출물에서 평가와 보고싶어요 목록은 최신순만 지원한다. -->
                    <div>
                        <label class="visually-hidden" for="recordSort">정렬</label>
                        <select id="recordSort"
                                class="form-select form-select-sm"
                                disabled>
                            <option value="latest">최신순</option>
                        </select>
                    </div>
                </div>

                <!-- API 요청 중에는 기존 목록 대신 로딩 상태를 표시한다. -->
                <div id="recordLoading"
                     class="py-5 text-center text-secondary"
                     role="status"
                     aria-live="polite">
                    기록을 불러오는 중입니다.
                </div>

                <!-- 오류 발생 시 기존 화면을 유지하고 같은 요청을 다시 수행할 수 있다. -->
                <div id="recordError"
                     class="alert alert-danger d-none"
                     role="alert">
                    <p id="recordErrorMessage" class="mb-3"></p>
                    <button id="recordRetryButton"
                            class="btn btn-outline-danger btn-sm"
                            type="button">
                        다시 시도
                    </button>
                </div>

                <!-- 정상 응답이지만 조회 결과가 없는 경우에만 표시한다. -->
                <div id="recordEmpty"
                     class="alert alert-secondary text-center d-none"
                     role="status">
                    <p id="recordEmptyMessage" class="mb-0"></p>
                </div>

                <!-- 평가 또는 보고싶어요 콘텐츠 카드가 JavaScript로 생성된다. -->
                <div id="recordList"
                     class="row row-cols-2 row-cols-md-3 row-cols-lg-4
                            row-cols-xl-5 g-3 d-none"
                     aria-live="polite">
                </div>

                <nav class="mt-4" aria-label="회원 기록 페이지">
                    <ul id="recordPagination"
                        class="pagination pagination-sm justify-content-center mb-0">
                    </ul>
                </nav>
            </div>
        </section>
    </main>

    <script th:src="@{/assets/js/cmn/common_fetch.js}"></script>
    <script th:src="@{/assets/js/user/user-list-ui.js}"></script>
    <script th:src="@{/assets/js/user/member-records.js}"></script>
</body>
</html>
