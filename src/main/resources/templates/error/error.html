<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>시스템 오류</title>
</head>
<body>
<!--시스템 오류 안내 (잠정판: 프론트 골격(layout.html) 도입 시 화면 규약에 맞춰 교체 예정)-->
<div style="max-width: 720px; margin: 3rem auto; font-family: sans-serif;">
    <h2>서비스 처리 중 오류가 발생했습니다</h2>
    <p th:text="${message}">오류 메시지</p>
    <a href="javascript:history.back()">이전 화면으로</a>
    <hr>
    <pre th:text="${errorTrace}" style="white-space: pre-wrap; font-size: 12px; color: #777;">스택트레이스(개발용)</pre>
</div>
<!--//시스템 오류 안내-->
</body>
</html>
