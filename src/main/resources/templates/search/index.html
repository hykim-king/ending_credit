<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>검색</title>
<link rel="stylesheet" th:href="@{/assets/css/search/search.css}">
<link rel="stylesheet" th:href="@{/assets/css/search/cards.css}">
<!-- 컬렉션 카드는 목록 화면(collection-list)의 것을 그대로 쓴다. search.js보다 먼저 실려야 한다 -->
<link rel="stylesheet" th:href="@{/assets/css/collection/collection-list.css}">
<script th:src="@{/assets/js/collection/collection-list.js}" defer></script>
<script th:src="@{/assets/js/common/collection-grid.js}" defer></script>
<script th:src="@{/assets/js/search/search.js}" defer></script>
<style>
	.search-section {
		margin-bottom: 40px;
	}
	.search-section h5 {
		display: flex;
		align-items: baseline;
		gap: 8px;
		margin-bottom: 16px;
	}
	.section-count {
		font-size: 13px;
		color: #777;
		font-weight: 400;
	}
	.section-more {
		margin-left: auto;
		font-size: 14px;
		color: #6550C8;
		text-decoration: none;
	}
	/* 유형 머릿말 - 영화만 전체 결과 화면(S-03)이 있어 링크가 된다 */
	.section-link {
		color: inherit;
		text-decoration: none;
	}
	.section-link:hover {
		color: #6550C8;
		text-decoration: underline;
	}
	/* .card-row와 카드 스타일은 assets/css/search/cards.css에 있다 */
	.search-empty {
		padding: 48px 0;
		text-align: center;
		color: #777;
	}
	/* 한 섹션이 실패해도 나머지는 그대로 보인다 */
	.section-error {
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 16px;
		border: 1px solid #E4E2E9;
		border-radius: 8px;
		color: #777;
		font-size: 14px;
	}
	/* S-05 재시도 - 누르는 동안 잠가 중복 요청을 막는다 */
	.retry-button {
		height: 32px;
		padding: 0 14px;
		border: 1px solid #6550C8;
		border-radius: 8px;
		background: #fff;
		color: #6550C8;
		font-weight: 600;
		cursor: pointer;
	}
	.retry-button:disabled {
		border-color: #C9C7D1;
		color: #C9C7D1;
		cursor: default;
	}
</style>
</head>
<body>
<div layout:fragment="content">

	<!-- 검색창 - 헤더의 END IT와 같은 왼쪽 기준선에서 열 전체 폭을 쓴다(S-01) -->
	<div th:replace="~{fragments/search_box :: hero(
	         ${#strings.isEmpty(query)} ? '검색' : null,
	         @{/search},
	         '영화, 인물, 컬렉션을 검색해 보세요',
	         '검색어',
	         ${!#strings.isEmpty(query)})}"></div>

	<!-- ── S-02 통합검색: 영화 → 인물 → 컬렉션 ──────────────────── -->
	<div th:if="${!#strings.isEmpty(query)}">

		<!-- 영화 - 정의서상 영화 결과를 가장 위에 둔다 -->
		<div class="search-section" th:if="${movieFailed != null or !movies.isEmpty()}">
			<h5>
				<!-- 머릿말은 영화만 검색하는 시작 화면으로 간다. 검색어를 버리는 것이 더보기와 갈리는 지점이다 -->
				<a class="section-link" th:href="@{/search/movies}">영화</a>
				<span class="section-count" th:if="${movieFailed == null}"
				      th:text="${movieTotalCnt} + '건'">0건</span>
				<a class="section-more" th:if="${hasMoreMovies}"
				   th:href="@{/search/movies(query=${query})}">더보기</a>
			</h5>
			<!-- S-05 검색 오류 - 검색어는 그대로 두고 재시도만 제공한다 -->
			<div class="section-error" th:if="${movieFailed != null}">
				<span>영화 결과를 불러오지 못했습니다.</span>
				<button type="button" class="retry-button">다시 시도</button>
			</div>
			<div class="card-row" th:if="${movieFailed == null}">
				<th:block th:each="movie : ${movies}">
					<div th:replace="~{fragments/cards :: movieCard(${movie})}"></div>
				</th:block>
			</div>
		</div>

		<!-- 인물 -->
		<div class="search-section" th:if="${personFailed != null or !people.isEmpty()}">
			<h5>
				<!-- 영화와 같이 머릿말은 인물만 검색하는 시작 화면으로 간다 -->
				<a class="section-link" th:href="@{/search/people}">인물</a>
				<span class="section-count" th:if="${personFailed == null}"
				      th:text="${personTotalCnt} + '건'">0건</span>
				<a class="section-more" th:if="${hasMorePeople}"
				   th:href="@{/search/people(query=${query})}">더보기</a>
			</h5>
			<!-- S-05 검색 오류 - 검색어는 그대로 두고 재시도만 제공한다 -->
			<div class="section-error" th:if="${personFailed != null}">
				<span>인물 결과를 불러오지 못했습니다.</span>
				<button type="button" class="retry-button">다시 시도</button>
			</div>
			<div class="card-row people" th:if="${personFailed == null}">
				<th:block th:each="person : ${people}">
					<div th:replace="~{fragments/cards :: personCard(${person}, ${personRoles[person.personId]})}"></div>
				</th:block>
			</div>
		</div>

		<!-- 컬렉션 -->
		<div class="search-section" th:if="${collectionFailed != null or !collections.isEmpty()}">
			<h5>
				<!-- 영화·인물과 같이 머릿말은 컬렉션만 검색하는 화면으로 간다 -->
				<a class="section-link" th:href="@{/collections}">컬렉션</a>
				<span class="section-count" th:if="${collectionFailed == null}"
				      th:text="${collectionTotalCnt} + '건'">0건</span>
				<a class="section-more" th:if="${hasMoreCollections}"
				   th:href="@{/collections(searchWord=${collectionQuery})}">더보기</a>
			</h5>
			<!-- S-05 검색 오류 - 검색어는 그대로 두고 재시도만 제공한다 -->
			<div class="section-error" th:if="${collectionFailed != null}">
				<span>컬렉션 결과를 불러오지 못했습니다.</span>
				<button type="button" class="retry-button">다시 시도</button>
			</div>
			<!-- 카드는 collection-list.js의 createCollectionCard가 그린다. 건수·오류 판정은 서버가 맡는다 -->
			<div id="collectionGrid" class="collection-card-grid"
			     th:if="${collectionFailed == null}"></div>
			<script th:inline="javascript" th:if="${collectionFailed == null}">
				window.enditCollections = /*[[${collections}]]*/ [];
				window.enditCollectionMemberId = /*[[${currentMemberId}]]*/ 0;
			</script>
		</div>

		<!-- S-04 검색 결과 없음 - 입력어를 되짚고 다음 행동을 제시한다 -->
		<div class="search-empty" th:if="${noResults}">
			<p><b th:text="'&quot;' + ${query} + '&quot;'">검색어</b>에 대한 결과가 없습니다.</p>
			<p>다른 키워드로 다시 검색해 보세요.</p>
		</div>
	</div>

	<!-- ── S-01 검색 시작 / S-04 결과 없음: 박스오피스 순위 ─────────── -->
	<!-- 순위는 /api/search/rankings로 따로 읽는다. 0건이거나 실패하면
	     search.js가 섹션을 숨겨 검색창만 남긴다.
	     S-04는 "초기 순위 포함"이 요건이라 결과가 0건일 때도 같이 그린다 -->
	<section class="search-panel search-section" id="rankingSection"
	         th:if="${#strings.isEmpty(query) or noResults}" hidden>
		<h5 class="ranking-title">박스오피스</h5>
		<ol class="ranking-list" id="rankingList"></ol>
	</section>


</div>
</body>
</html>
