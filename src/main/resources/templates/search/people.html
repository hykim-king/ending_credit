<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>인물 검색 결과</title>
<link rel="stylesheet" th:href="@{/assets/css/search/search.css}">
<link rel="stylesheet" th:href="@{/assets/css/search/cards.css}">
<style>
	.result-head {
		display: flex;
		align-items: center;
		gap: 12px;
		padding-top: 24px;
		margin-bottom: 20px;
	}
	.result-head h5 {
		margin: 0;
		font-size: 18px;
	}
	.result-count {
		font-size: 14px;
		color: #777;
	}
	.result-back {
		margin-left: auto;
		font-size: 14px;
		color: #6550C8;
		text-decoration: none;
	}
	.pager {
		display: flex;
		justify-content: center;
		gap: 6px;
		margin: 36px 0;
	}
	.pager a,
	.pager span {
		min-width: 40px;
		height: 40px;
		display: flex;
		align-items: center;
		justify-content: center;
		border: 1px solid #E4E2E9;
		border-radius: 6px;
		text-decoration: none;
		color: #17171B;
	}
	.pager .current {
		background: #6550C8;
		border-color: #6550C8;
		color: #fff;
		font-weight: 600;
	}
	.search-empty {
		padding: 48px 0;
		text-align: center;
		color: #777;
	}
</style>
</head>
<body>
<div layout:fragment="content">

<!-- ── 검색어 없음: 인물 전용 검색 시작 화면 ─────────────────── -->
<!-- S-02 머릿말 "인물"이 들어오는 자리다. 영화의 박스오피스 자리에 인기 인물을 둔다 -->
<div th:if="${#strings.isEmpty(query)}">

	<!-- 통합검색과 달리 인물 결과로 곧장 간다 -->
	<div th:replace="~{fragments/search_box :: hero(
	         '인물 검색', @{/search/people}, '감독·배우 이름을 검색해 보세요', '인물 검색어', false)}"></div>

	<!-- 좋아요를 한 번도 받지 못한 상태면 목록이 비므로 섹션째 숨긴다 -->
	<section class="search-panel" th:if="${!popularPeople.isEmpty()}">
		<h5 class="ranking-title">인기 인물</h5>
		<ol class="ranking-list">
			<li th:each="person, stat : ${popularPeople}">
				<a class="ranking-link" th:href="@{'/people/' + ${person.personId}}">
					<span class="ranking-no" th:text="${stat.count}">1</span>
					<span class="ranking-title-text" th:text="${person.nameKo}">이름</span>
					<span class="ranking-role" th:if="${popularRoles[person.personId] != null}"
					      th:text="${popularRoles[person.personId]}">감독</span>
				</a>
			</li>
		</ol>
	</section>

</div>

<!-- ── 검색어 있음: 인물 결과 ────────────────────────────────── -->
<div th:if="${!#strings.isEmpty(query)}">

	<!-- 검색어와 결과 수. 재검색은 헤더 검색창이 맡는다 -->
	<div class="result-head">
		<h5 th:text="'&quot;' + ${query} + '&quot; 인물 결과'">인물 결과</h5>
		<span class="result-count" th:if="${personFailed == null}"
		      th:text="${paging.totalCnt}">0</span>
		<a class="result-back" th:href="@{/search(query=${query})}">통합검색으로</a>
	</div>

	<div class="search-empty" th:if="${personFailed != null}">
		인물 결과를 불러오지 못했습니다.
	</div>

	<div class="search-empty"
	     th:if="${personFailed == null and people.isEmpty()}">
		<p><b th:text="'&quot;' + ${query} + '&quot;'">검색어</b>에 대한 인물이 없습니다.</p>
	</div>

	<div class="card-row people" th:if="${!people.isEmpty()}">
		<th:block th:each="person : ${people}">
			<div th:replace="~{fragments/cards :: personCard(${person}, ${personRoles[person.personId]})}"></div>
		</th:block>
	</div>

	<!-- 페이저 - startNo/endNo/pre/next는 DTO가 totalCnt를 받을 때 이미 계산해 둔 값이다.
	     범위 밖 page가 오면 DTO가 endNo만 깎고 startNo는 남겨 두어 sequence가 역순으로 돌므로,
	     startNo <= endNo일 때만 그린다 -->
	<nav class="pager" th:if="${paging.totalCnt > 0 and paging.startNo &lt;= paging.endNo}" aria-label="페이지">
		<a th:if="${paging.pre}"
		   th:href="@{/search/people(query=${query}, page=${paging.startNo - 1})}">&lsaquo;</a>

		<th:block th:each="pageNo : ${#numbers.sequence(paging.startNo, paging.endNo)}">
			<span th:if="${pageNo == paging.pageNo}" class="current" th:text="${pageNo}">1</span>
			<a th:unless="${pageNo == paging.pageNo}"
			   th:href="@{/search/people(query=${query}, page=${pageNo})}"
			   th:text="${pageNo}">2</a>
		</th:block>

		<a th:if="${paging.next}"
		   th:href="@{/search/people(query=${query}, page=${paging.endNo + 1})}">&rsaquo;</a>
	</nav>

</div>
</div>
</body>
</html>
