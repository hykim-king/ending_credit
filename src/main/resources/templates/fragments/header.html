<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
    <header th:fragment="header" class="bg-primary text-white  py-2 px-3">
        <div class="bg-primary text-white p-3">
            <nav class="navbar navbar-expand-lg bg-primary">
	            <div class="container-fluid">
	                <a class="navbar-brand text-white" href="#">PCWK</a>
	                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
	                <span class="navbar-toggler-icon"></span>
	                </button>
	                <div class="collapse navbar-collapse" id="navbarNav">
	                <ul class="navbar-nav">
	                    <li class="nav-item">
	                    	<a class="nav-link active  text-white" aria-current="page" href="#">Home</a>
	                    </li>
	                    <li class="nav-item">
	                    	<a class="nav-link  text-white" th:href="@{/user/doRetrieve}">Member</a>
	                    </li>
	                    <li class="nav-item">
	                    	<a class="nav-link  text-white" th:href="@{/board/board_list}">T-게시목록</a>
	                    </li>
	                    <li class="nav-item">
	                    	<a class="nav-link  text-white" th:href="@{/board/board_reg}">T-게시등록</a>
	                    </li>	      
	                    
	                    <li class="nav-item" sec:authorize="isAnonymous()">
	                       <!-- 로그인 전 -->             
	                       <a class="nav-link text-white" href="#">Login</a>
	                    </li> 
	                    <!-- 로그인 후 -->
	                    <li class="nav-item" sec:authorize="isAuthenticated()">
                           <form th:action="@{/logout/logout}" method="POST">
                                <button type="submit" class="btn btn-link nav-link text-white">로그아웃 <span sec:authentication="name" class="badge text-bg-light"/></button>
                           </form>
                        </li>               
	                </ul>
	                </div>
	            </div>
            </nav>
        </div>
    </header>
</body>
</html>
