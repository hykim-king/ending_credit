<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>로그인 안내 모달</title>
</head>
<body>

<!--
  비회원 로그인 안내(C-09·MOD-01, C-01·P-01 공용). 3조 컬렉션 상세의 골격·클래스를 그대로 쓴다 -
  같은 안내가 화면마다 다르게 보이지 않게 한다.
  description을 비워 넘기면 무엇을 하려다 막혔는지에 맞춰 화면 스크립트가 채운다.
  쓰는 화면은 assets/css/content/detail.css의 collection-delete-* 클래스와 부트스트랩 JS가 필요하다.
-->
<div th:fragment="modal(description)" class="modal fade" id="loginRequiredModal" tabindex="-1"
     th:aria-label="#{detail.login.title}" aria-label="로그인 안내" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content collection-delete-modal">
			<button type="button" class="btn-close collection-delete-close" data-bs-dismiss="modal"
			        th:aria-label="#{common.lang.close}" aria-label="닫기"></button>
			<div class="modal-body">
				<div class="collection-login-icon" aria-hidden="true">
					<i class="bi bi-person-lock"></i>
				</div>
				<p class="collection-delete-question" th:text="#{detail.login.title}">로그인이 필요해요</p>
				<p class="collection-delete-description" id="loginRequiredDescription" aria-live="polite"
				   th:text="${description}"></p>
				<div class="collection-delete-actions">
					<button type="button" class="btn collection-delete-button collection-delete-cancel"
					        data-bs-dismiss="modal" th:text="#{common.lang.confirm.cancel}">취소</button>
					<a class="btn btn-primary collection-delete-button" th:href="@{/login}"
					   th:text="#{common.header.login}">로그인</a>
				</div>
			</div>
		</div>
	</div>
</div>

</body>
</html>
