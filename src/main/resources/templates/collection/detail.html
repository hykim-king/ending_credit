<!DOCTYPE html>
<!--
Modification History
2026. 8. 29. jinyoung - 상세 조회·소유자 작업·좋아요 적용
2026. 8. 31. jinyoung - 링크 복사·댓글 연결·작품 평가 정보 적용
2026. 9. 01. jinyoung - 포스터 콜라주·보기 전환·더보기 UI 적용
2026. 9. 02. jinyoung - 반응형·소유자 작업·내 평가 표시 개선
2026. 9. 05. jinyoung - 컬렉션 댓글 작성·대표 댓글·전체 댓글 모달 적용
-->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>컬렉션 상세</title>
    <link rel="stylesheet" th:href="@{/assets/css/collection/common.css}">
    <link rel="stylesheet" th:href="@{/assets/css/collection/collection-detail.css}">
    <script th:src="@{/assets/js/collection/collection-detail.js}" defer></script>
</head>
<body>
<div layout:fragment="content"
     id="collectionDetailPage"
     class="collection-page collection-detail-page"
     th:attr="data-collection-id=${collectionId},data-current-member-id=${currentMemberId}">
    <!-- 이전 화면과 오류 안내 -->
    <a id="collectionBackLink" class="collection-back-link" th:href="@{/collections}">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
        이전으로
    </a>

    <div id="errorMessage" class="alert alert-danger d-none" role="alert" tabindex="-1"></div>

    <!-- 컬렉션 정보 -->
    <div class="collection-detail-block">
        <section class="collection-detail-hero" aria-labelledby="collectionTitle">
            <!-- 표지와 작성자 작업 -->
            <div id="collectionDetailCover" class="collection-detail-cover">
                <div id="collectionDetailCoverFallback" class="collection-detail-cover-fallback" aria-hidden="true">
                    <i class="bi bi-collection-play"></i>
                </div>

                <div class="collection-cover-author">
                    <span id="collectionAuthorAvatar" class="collection-cover-avatar collection-cover-avatar-fallback"
                          aria-hidden="true">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <strong id="collectionAuthor">작성자</strong>
                </div>

                <span id="privateBadge" class="collection-private-badge d-none">
                    <i class="bi bi-lock-fill" aria-hidden="true"></i>
                    비공개
                </span>
                <div id="ownerActions" class="collection-owner-actions d-none">
                    <a id="editLink" class="collection-owner-action" href="#">
                        <i class="bi bi-pencil" aria-hidden="true"></i>
                        <span>수정</span>
                    </a>
                    <button class="collection-owner-action collection-danger-action" type="button" data-bs-toggle="modal"
                            data-bs-target="#deleteCollectionModal">
                        <i class="bi bi-trash3" aria-hidden="true"></i>
                        <span>삭제</span>
                    </button>
                </div>
            </div>

            <div class="collection-detail-heading">
                <h1 id="collectionTitle" class="collection-detail-title">컬렉션</h1>
                <p id="collectionDescription" class="collection-detail-description">컬렉션 정보를 불러오고 있습니다.</p>
                <div class="collection-detail-heading-meta">
                    <time id="collectionDate" datetime=""></time>
                </div>
            </div>

            <!-- 좋아요·댓글·링크 -->
            <div class="collection-detail-stats" aria-label="컬렉션 활동">
                <button id="likeButton" class="collection-stat-action" type="button" aria-pressed="false">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                    <span id="likeButtonLabel">좋아요</span>
                    <strong id="likeCount">0</strong>
                </button>
                <button id="commentsLink" class="collection-stat-action" type="button">
                    <i class="bi bi-chat" aria-hidden="true"></i>
                    <span>댓글</span>
                    <strong id="commentCount">0</strong>
                </button>
                <button id="copyLinkButton" class="collection-stat-action" type="button">
                    <i class="bi bi-link-45deg" aria-hidden="true"></i>
                    <span>링크 복사</span>
                </button>
            </div>
        </section>

        <!-- 담긴 작품 -->
        <section class="collection-movies-section" aria-labelledby="collectionMoviesHeading">
            <header class="collection-movies-heading">
                <h2 id="collectionMoviesHeading" class="collection-section-title mb-0">담긴 작품 <span id="itemResultCount">0</span></h2>
                <div class="collection-view-toggle" aria-label="작품 보기 방식">
                    <button id="gridViewButton" class="collection-view-button is-active" type="button"
                            aria-label="포스터형으로 보기"
                            aria-pressed="true">
                        <i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>
                    </button>
                    <button id="listViewButton" class="collection-view-button" type="button"
                            aria-label="리스트형으로 보기"
                            aria-pressed="false">
                        <i class="bi bi-list-ul" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <div id="itemLoading" class="collection-movie-grid" role="status" aria-live="polite"
                 aria-label="컬렉션 작품을 불러오는 중입니다">
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
            </div>

            <div id="itemList" class="collection-movie-grid is-grid-view d-none" aria-live="polite"></div>

            <div id="itemEmpty" class="collection-empty-state d-none">
                <i class="bi bi-film collection-empty-icon" aria-hidden="true"></i>
                <strong>아직 담긴 작품이 없습니다.</strong>
                <span>작성자가 작품을 추가하면 이곳에 표시됩니다.</span>
            </div>

            <div class="collection-load-more-wrap">
                <button id="loadMoreButton" class="collection-load-more-button d-none" type="button">
                    <span id="loadMoreLabel">더보기</span>
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
            </div>
        </section>

        <!-- 댓글 작성 및 대표 댓글 -->
        <section id="collectionComments" class="collection-comments-section"
                 aria-labelledby="collectionCommentsHeading"
                 tabindex="-1">
            <div class="collection-comments-heading-row">
                <h2 id="collectionCommentsHeading" class="collection-section-title">
                    댓글 <span id="commentSectionCount">0</span>
                </h2>
                <button id="allCommentsButton" class="collection-all-comments-button" type="button">
                    모든 댓글 <i class="bi bi-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
            <div class="collection-comment-composer">
                <div class="collection-comment-input-wrap">
                    <label class="visually-hidden" for="collectionCommentInput">컬렉션 댓글</label>
                    <textarea id="collectionCommentInput" rows="1" maxlength="1000"
                              placeholder="컬렉션에 댓글을 남겨보세요."></textarea>
                    <label class="collection-comment-spoiler" for="collectionCommentSpoiler">
                        <input id="collectionCommentSpoiler" type="checkbox">
                        <span>스포일러 포함</span>
                    </label>
                </div>
                <button id="submitCommentButton" type="button">등록</button>
            </div>

            <div id="collectionCommentEmpty" class="collection-comment-empty d-none">
                <i class="bi bi-chat-square-text" aria-hidden="true"></i>
                <p>아직 등록된 댓글이 없어요. 첫 번째 댓글을 남겨보세요 :)</p>
            </div>

            <article id="collectionCommentPreview" class="collection-comment-card d-none"></article>
        </section>
    </div>

    <!-- 링크 복사 안내 -->
    <p id="copyLinkFeedback" class="collection-copy-feedback" role="status" aria-live="polite">링크를 복사했어요</p>

    <!-- 댓글 안내 토스트 -->
    <div class="collection-comment-toast-wrap">
        <div id="collectionCommentToast" class="toast collection-comment-toast" role="status"
             aria-live="polite" aria-atomic="true" data-bs-delay="3000">
            <div class="toast-body"></div>
        </div>
    </div>

    <!-- 전체 댓글 모달 -->
    <div class="modal fade" id="allCommentsModal" tabindex="-1" aria-labelledby="allCommentsModalTitle"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable collection-comments-modal-dialog">
            <div class="modal-content collection-comments-modal">
                <div class="collection-comments-modal-header">
                    <h2 id="allCommentsModalTitle">모든 댓글 <span id="allCommentsCount">0</span></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="allCommentsList" class="collection-comments-modal-list"></div>
                    <div id="allCommentsEmpty" class="collection-comment-empty d-none">
                        <i class="bi bi-chat-square-text" aria-hidden="true"></i>
                        <p>아직 등록된 댓글이 없어요.</p>
                    </div>
                    <button id="loadMoreCommentsButton" class="collection-comments-load-more d-none"
                            type="button">댓글 더보기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 비회원 로그인 안내 모달 -->
    <div class="modal fade" id="commentLoginModal" tabindex="-1" aria-label="로그인 안내"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content collection-delete-modal">
                <button type="button" class="btn-close collection-delete-close" data-bs-dismiss="modal"
                        aria-label="닫기"></button>
                <div class="modal-body">
                    <div class="collection-login-icon" aria-hidden="true">
                        <i class="bi bi-person-lock"></i>
                    </div>
                    <p class="collection-delete-question">로그인이 필요해요</p>
                    <p class="collection-delete-description">로그인 후 컬렉션에 댓글을 남길 수 있어요.</p>
                    <div class="collection-delete-actions">
                        <button type="button" class="btn collection-delete-button collection-delete-cancel"
                                data-bs-dismiss="modal">취소</button>
                        <a class="btn btn-primary collection-delete-button" th:href="@{/login}">로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal fade" id="deleteCollectionModal" tabindex="-1" aria-label="컬렉션 삭제 확인"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content collection-delete-modal">
                <button type="button" class="btn-close collection-delete-close" data-bs-dismiss="modal"
                        aria-label="닫기"></button>
                <div class="modal-body">
                    <div class="collection-delete-icon" aria-hidden="true">
                        <i class="bi bi-trash3"></i>
                    </div>
                    <p class="collection-delete-question">해당 컬렉션을 삭제할까요?</p>
                    <p class="collection-delete-description">컬렉션에 기록된 좋아요와 댓글 기록이 모두 삭제되며 되돌릴 수 없습니다.</p>
                    <div class="collection-delete-actions">
                        <button type="button" class="btn collection-delete-button collection-delete-cancel"
                                data-bs-dismiss="modal">취소</button>
                        <button id="confirmDeleteButton" type="button"
                                class="btn btn-danger collection-delete-button">삭제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/assets/js/bootstrap.js}"></script>
    <script th:src="@{/assets/js/cmn/common_fetch.js}"></script>
    <script th:src="@{/assets/js/collection/collection-like.js}"></script>

</div>
</body>
</html>
