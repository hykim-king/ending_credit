<!DOCTYPE html>
<!--
Modification History
2026. 8. 29. jinyoung - D-01 조회 전용·소유자 관리·좋아요 정책 적용
2026. 8. 31. jinyoung - 공개 링크 복사·코멘트 화면 연결·작품 평균 별점 적용
2026. 9. 01. jinyoung - 화면설계서 v3.0 기준 D-01·D-05 본문 UI 반영
2026. 9. 01. jinyoung - 컬렉션 내부 작품 포스터 상단 콜라주 적용
-->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<title>컬렉션 상세</title>
<link rel="stylesheet" th:href="@{/assets/css/collection.css}">
<script th:src="@{/assets/js/collection/collection-detail.js}" defer></script>
</head>
<body>
<div layout:fragment="content"
     id="collectionDetailPage"
     class="collection-page collection-detail-page"
     th:attr="data-collection-id=${collectionId},data-current-member-id=${currentMemberId}">
    <a class="collection-back-link" th:href="@{/collections}">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
        컬렉션 목록
    </a>

    <div id="errorMessage"
         class="alert alert-danger d-none"
         role="alert"
         tabindex="-1"></div>

    <section class="collection-detail-hero" aria-labelledby="collectionTitle">
        <div id="collectionDetailCover" class="collection-detail-cover">
            <div id="collectionDetailCoverFallback"
                 class="collection-detail-cover-fallback"
                 aria-hidden="true">
                <i class="bi bi-collection-play"></i>
            </div>
        </div>
        <div class="collection-detail-heading">
            <div class="collection-detail-copy">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <span class="collection-kicker">COLLECTION</span>
                    <span id="publicBadge" class="collection-visibility-badge"></span>
                </div>
                <h1 id="collectionTitle" class="collection-detail-title">컬렉션</h1>
                <p id="collectionDescription" class="collection-detail-description">
                    컬렉션 정보를 불러오고 있습니다.
                </p>
                <p class="collection-detail-author mb-0">
                    <span id="collectionAuthor">작성자</span>
                    <span aria-hidden="true">·</span>
                    <time id="collectionDate"></time>
                </p>
            </div>

            <div id="collectionActions" class="collection-detail-actions">
                <button id="likeButton"
                        class="collection-icon-action d-none"
                        type="button"
                        aria-pressed="false">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                    <span id="likeButtonLabel">좋아요</span>
                </button>
                <button id="copyLinkButton"
                        class="collection-icon-action d-none"
                        type="button">
                    <i class="bi bi-link-45deg" aria-hidden="true"></i>
                    <span>링크 복사</span>
                </button>
                <a id="commentsLink" class="collection-icon-action" href="#">
                    <i class="bi bi-chat" aria-hidden="true"></i>
                    <span>코멘트</span>
                </a>
                <div id="ownerActions" class="collection-owner-actions d-none">
                    <a id="editLink" class="collection-icon-action" href="#">
                        <i class="bi bi-pencil" aria-hidden="true"></i>
                        <span>수정</span>
                    </a>
                    <button class="collection-icon-action collection-danger-action"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteCollectionModal">
                        <i class="bi bi-trash3" aria-hidden="true"></i>
                        <span>삭제</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="collection-detail-stats" aria-label="컬렉션 활동 정보">
            <div>
                <span>작품</span>
                <strong id="itemCount">0</strong>
            </div>
            <div>
                <span>좋아요</span>
                <strong id="likeCount">0</strong>
            </div>
            <div>
                <span>코멘트</span>
                <strong id="commentCount">0</strong>
            </div>
        </div>
    </section>

    <p id="copyLinkFeedback"
       class="collection-copy-feedback d-none"
       role="status"
       aria-live="polite">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        링크를 복사했습니다.
    </p>

    <section class="collection-movies-section" aria-labelledby="collectionMoviesHeading">
        <header class="collection-movies-heading">
            <div>
                <p class="collection-kicker mb-1">MOVIES</p>
                <h2 id="collectionMoviesHeading" class="collection-section-title mb-0">
                    담긴 작품
                </h2>
            </div>
            <span id="itemResultCount" class="collection-result-count">0개</span>
        </header>

        <div id="itemLoading"
             class="collection-movie-grid"
             role="status"
             aria-live="polite"
             aria-label="컬렉션 작품을 불러오는 중입니다">
            <div class="collection-movie-skeleton"></div>
            <div class="collection-movie-skeleton"></div>
            <div class="collection-movie-skeleton"></div>
            <div class="collection-movie-skeleton"></div>
            <div class="collection-movie-skeleton"></div>
        </div>

        <div id="itemList"
             class="collection-movie-grid d-none"
             aria-live="polite"></div>

        <div id="itemEmpty" class="collection-empty-state d-none">
            <i class="bi bi-film collection-empty-icon" aria-hidden="true"></i>
            <strong>아직 담긴 작품이 없습니다.</strong>
            <span>작성자가 작품을 추가하면 이곳에 표시됩니다.</span>
        </div>

        <nav class="mt-4" aria-label="컬렉션 작품 페이지">
            <ul id="itemPagination" class="pagination justify-content-center"></ul>
        </nav>
    </section>

    <div class="modal fade"
         id="deleteCollectionModal"
         tabindex="-1"
         aria-labelledby="deleteCollectionModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content collection-delete-modal">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="deleteCollectionModalLabel">
                        컬렉션 삭제
                    </h2>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div class="collection-delete-icon" aria-hidden="true">
                        <i class="bi bi-trash3"></i>
                    </div>
                    <p class="mb-2">
                        <strong id="deleteCollectionTitle">이 컬렉션</strong>을 삭제할까요?
                    </p>
                    <p class="text-secondary small mb-0">
                        컬렉션과 좋아요·코멘트 연결 정보가 함께 삭제되며 되돌릴 수 없습니다.
                        영화 정보 자체는 삭제되지 않습니다.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">취소</button>
                    <button id="confirmDeleteButton"
                            type="button"
                            class="btn btn-danger">삭제</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
