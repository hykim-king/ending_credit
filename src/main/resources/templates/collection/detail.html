<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<title>컬렉션 상세</title>
<link rel="stylesheet" th:href="@{/assets/css/collection.css}">
<script th:src="@{/assets/js/collection/collection-detail.js}" defer></script>
</head>
<body>
<div layout:fragment="content"
     id="collectionDetailPage"
     class="collection-page collection-detail-page"
     th:attr="data-collection-id=${collectionId},data-current-member-id=${currentMemberId}">
    <a class="collection-back-link" th:href="@{/collections}">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
        컬렉션 목록
    </a>

    <div id="errorMessage"
         class="alert alert-danger d-none"
         role="alert"
         tabindex="-1"></div>

    <div class="collection-detail-block">
        <section class="collection-detail-hero" aria-labelledby="collectionTitle">
            <div id="collectionDetailCover" class="collection-detail-cover">
                <div id="collectionDetailCoverFallback"
                     class="collection-detail-cover-fallback"
                     aria-hidden="true">
                    <i class="bi bi-collection-play"></i>
                </div>

                <div class="collection-cover-author">
                    <span id="collectionAuthorAvatar"
                          class="collection-cover-avatar collection-cover-avatar-fallback"
                          aria-hidden="true">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <strong id="collectionAuthor">작성자</strong>
                </div>

                <span id="privateBadge" class="collection-private-badge d-none">
                    <i class="bi bi-lock-fill" aria-hidden="true"></i>
                    비공개
                </span>
                <div id="ownerActions" class="collection-owner-actions d-none">
                    <a id="editLink" class="collection-owner-action" href="#">
                        <i class="bi bi-pencil" aria-hidden="true"></i>
                        <span>수정</span>
                    </a>
                    <button class="collection-owner-action collection-danger-action"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteCollectionModal">
                        <i class="bi bi-trash3" aria-hidden="true"></i>
                        <span>삭제</span>
                    </button>
                </div>
            </div>

            <div class="collection-detail-heading">
                <h1 id="collectionTitle" class="collection-detail-title">컬렉션</h1>
                <p id="collectionDescription" class="collection-detail-description">
                    컬렉션 정보를 불러오고 있습니다.
                </p>
                <div class="collection-detail-heading-meta">
                    <time id="collectionDate" datetime=""></time>
                </div>
            </div>

            <div class="collection-detail-stats" aria-label="컬렉션 활동">
                <button id="likeButton"
                        class="collection-stat-action"
                        type="button"
                        aria-pressed="false">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                    <span id="likeButtonLabel">좋아요</span>
                    <strong id="likeCount">0</strong>
                </button>
                <button id="commentsLink"
                        class="collection-stat-action"
                        type="button">
                    <i class="bi bi-chat" aria-hidden="true"></i>
                    <span>댓글</span>
                    <strong id="commentCount">0</strong>
                </button>
                <button id="copyLinkButton"
                        class="collection-stat-action"
                        type="button">
                    <i class="bi bi-link-45deg" aria-hidden="true"></i>
                    <span>링크 복사</span>
                </button>
            </div>
        </section>

        <section class="collection-movies-section" aria-labelledby="collectionMoviesHeading">
            <header class="collection-movies-heading">
                <h2 id="collectionMoviesHeading" class="collection-section-title mb-0">
                    담긴 작품 <span id="itemResultCount">0</span>
                </h2>
                <div class="collection-view-toggle" aria-label="작품 보기 방식">
                    <button id="gridViewButton"
                            class="collection-view-button is-active"
                            type="button"
                            aria-label="포스터형으로 보기"
                            aria-pressed="true">
                        <i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>
                    </button>
                    <button id="listViewButton"
                            class="collection-view-button"
                            type="button"
                            aria-label="리스트형으로 보기"
                            aria-pressed="false">
                        <i class="bi bi-list-ul" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <div id="itemLoading"
                 class="collection-movie-grid"
                 role="status"
                 aria-live="polite"
                 aria-label="컬렉션 작품을 불러오는 중입니다">
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
                <div class="collection-movie-skeleton"></div>
            </div>

            <div id="itemList"
                 class="collection-movie-grid is-grid-view d-none"
                 aria-live="polite"></div>

            <div id="itemEmpty" class="collection-empty-state d-none">
                <i class="bi bi-film collection-empty-icon" aria-hidden="true"></i>
                <strong>아직 담긴 작품이 없습니다.</strong>
                <span>작성자가 작품을 추가하면 이곳에 표시됩니다.</span>
            </div>

            <div class="collection-load-more-wrap">
                <button id="loadMoreButton"
                        class="collection-load-more-button d-none"
                        type="button">
                    <span id="loadMoreLabel">더보기</span>
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
            </div>
        </section>

        <section id="collectionComments"
                 class="collection-comments-section"
                 aria-labelledby="collectionCommentsHeading"
                 tabindex="-1">
            <h2 id="collectionCommentsHeading" class="collection-section-title">
                댓글 <span id="commentSectionCount">0</span>
            </h2>
            <div class="collection-comment-composer">
                <label class="visually-hidden" for="collectionCommentInput">
                    컬렉션 댓글
                </label>
                <textarea id="collectionCommentInput"
                          rows="1"
                          placeholder="컬렉션에 댓글을 남겨보세요."
                          disabled></textarea>
                <button type="button" disabled>
                    <i class="bi bi-chat" aria-hidden="true"></i>
                    등록
                </button>
            </div>
        </section>
    </div>

    <p id="copyLinkFeedback"
       class="collection-copy-feedback"
       role="status"
       aria-live="polite">
        링크를 복사했어요
    </p>

    <div class="modal fade"
         id="deleteCollectionModal"
         tabindex="-1"
         aria-label="컬렉션 삭제 확인"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content collection-delete-modal">
                <button type="button"
                        class="btn-close collection-delete-close"
                        data-bs-dismiss="modal"
                        aria-label="닫기"></button>
                <div class="modal-body">
                    <div class="collection-delete-icon" aria-hidden="true">
                        <i class="bi bi-trash3"></i>
                    </div>
                    <p class="collection-delete-question">
                        해당 컬렉션을 삭제할까요?
                    </p>
                    <p class="collection-delete-description">
                        컬렉션에 기록된 좋아요와 댓글 기록이 모두 삭제되며 되돌릴 수 없습니다.
                    </p>
                    <div class="collection-delete-actions">
                        <button type="button"
                                class="btn collection-delete-button collection-delete-cancel"
                                data-bs-dismiss="modal">취소</button>
                        <button id="confirmDeleteButton"
                                type="button"
                                class="btn btn-danger collection-delete-button">삭제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
