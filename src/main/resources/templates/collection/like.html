<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
<title>좋아요 목록</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<!-- 서버는 조회 대상 회원 번호만 data-* 속성에 넣고, 목록 데이터는 REST API로 가져온다. -->
<body class="bg-light" th:attr="data-member-id=${memberId}">
    <header class="border-bottom bg-white">
        <div class="container py-3 d-flex justify-content-between align-items-center">
            <a class="text-decoration-none text-dark fs-4 fw-bold" th:href="@{/collections}">
                Ending Credit
            </a>
        </div>
    </header>

    <main class="container py-4">
        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <!-- 프로필 요약 영역 닉네임은 서버가 내려주는 값을 그대로 사용한다. -->
        <div class="mb-4">
            <h1 id="profileNickname" class="h4 mb-1">사용자 닉네임</h1>
            <a id="backToProfileLink" class="text-secondary small" href="#">프로필로 돌아가기</a>
        </div>

        <!-- 인물/컬렉션 두 탭 type 쿼리 파라미터로 전환하며 각 탭 수는 API 응답으로 갱신한다. -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button id="personTabButton" class="nav-link" type="button"
                        role="tab" aria-selected="false">
                    좋아한 인물 <span id="personCount">0</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button id="collectionTabButton" class="nav-link" type="button"
                        role="tab" aria-selected="false">
                    좋아한 컬렉션 <span id="collectionCount">0</span>
                </button>
            </li>
        </ul>

        <!-- GET /api/users/{memberId}/likes?type=... 결과 카드가 JavaScript로 채워진다. -->
        <div id="likeResultCount" class="text-secondary small mb-2"></div>
        <div id="likeList" class="row g-3" aria-live="polite"></div>

        <div id="likeEmpty" class="alert alert-secondary text-center d-none">
            좋아요한 항목이 없습니다.
        </div>

        <nav class="mt-4" aria-label="좋아요 목록 페이지">
            <ul id="likePagination" class="pagination justify-content-center"></ul>
        </nav>
    </main>

    <script th:src="@{/assets/js/cmn/common_fetch.js}"></script>
    <script th:src="@{/assets/js/user/user-likes.js}"></script>
</body>
</html>
