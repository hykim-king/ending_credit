<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좋아요 목록</title>
<style>
    /* U-07 좋아요 목록 */
    .like-tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: #6B6577;
        font-size: .95rem;
        padding: .5rem 0;
    }
    .like-tab.active {
        color: var(--endit-primary);
        font-weight: 700;
        border-bottom-color: var(--endit-primary);
    }
    .like-tab:focus-visible {
        outline: 2px solid var(--endit-focus);
        outline-offset: 2px;
    }
    .like-card {
        background: #fff;
        border: 1px solid var(--endit-border);
        border-radius: 12px;
        height: 100%;
    }
    .like-heart-btn {
        border: 0;
        background: none;
        color: var(--endit-primary);
        padding: 0;
        min-width: 44px;
        min-height: 44px;
    }
    .like-heart-btn:focus-visible {
        outline: 2px solid var(--endit-focus);
        outline-offset: 2px;
    }
</style>
</head>
<body>

<div layout:fragment="content" id="likesRoot" th:attr="data-member-id=${memberId}">

    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

    <!-- 프로필 요약 영역.-->
    <div class="mb-4">
        <h1 id="profileNickname" class="h4 mb-1">사용자 닉네임</h1>
        <a id="backToProfileLink" class="text-secondary small" href="#">프로필로 돌아가기</a>
    </div>

    <!-- 인물/컬렉션 두 탭. -->
    <div class="d-flex gap-4 border-bottom mb-4">
        <button id="personTabButton" class="like-tab" type="button" role="tab" aria-selected="false">
            좋아한 인물 <span id="personCount">0</span>
        </button>
        <button id="collectionTabButton" class="like-tab" type="button" role="tab" aria-selected="false">
            좋아한 컬렉션 <span id="collectionCount">0</span>
        </button>
    </div>

    <div id="likeResultCount" class="text-secondary small mb-2"></div>
    <div id="likeList" class="row g-3" aria-live="polite"></div>

    <div id="likeEmpty" class="alert alert-secondary text-center d-none">
        좋아요한 항목이 없습니다.
    </div>

    <nav class="mt-4" aria-label="좋아요 목록 페이지">
        <ul id="likePagination" class="pagination justify-content-center"></ul>
    </nav>

</div>

<script th:src="@{/assets/js/collection/collection-userlike.js}"></script>
</body>
</html>
