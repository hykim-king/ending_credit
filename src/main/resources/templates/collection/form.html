<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<title th:text="${formMode == 'update'} ? '컬렉션 수정' : '컬렉션 만들기'">
    컬렉션 만들기
</title>
<link rel="stylesheet" th:href="@{/assets/css/collection.css}">
<script th:src="@{/assets/js/collection/collection-form.js}" defer></script>
</head>
<body>
<div layout:fragment="content"
     id="collectionFormPage"
     class="collection-page collection-editor-page"
     th:attr="data-form-mode=${formMode},data-collection-id=${collectionId}">
    <div class="collection-editor">
        <header class="collection-page-heading">
            <p class="collection-kicker mb-2">COLLECTION</p>
            <h1 id="formTitle" class="collection-page-title">새 컬렉션 만들기</h1>
            <p id="formDescription" class="collection-page-description mb-0">
                좋아하는 영화를 한곳에 모아 나만의 컬렉션을 만들어 보세요.
            </p>
        </header>

        <div id="errorMessage"
             class="alert alert-danger d-none"
             role="alert"
             tabindex="-1"></div>

        <form id="collectionForm" novalidate>
            <section class="collection-editor-panel" aria-labelledby="collectionInfoHeading">
                <div class="collection-section-heading">
                    <div>
                        <p class="collection-section-number mb-1">01</p>
                        <h2 id="collectionInfoHeading" class="collection-section-title mb-0">
                            컬렉션 정보
                        </h2>
                    </div>
                    <span class="collection-required-guide">* 필수 입력</span>
                </div>

                <div class="collection-field">
                    <div class="d-flex justify-content-between align-items-center gap-3">
                        <label class="form-label" for="title">제목 *</label>
                        <span class="collection-field-count">최대 100자</span>
                    </div>
                    <input id="title"
                           class="form-control collection-input"
                           type="text"
                           maxlength="100"
                           placeholder="컬렉션 제목을 입력하세요"
                           autocomplete="off"
                           required>
                    <div class="invalid-feedback">컬렉션 제목을 입력해 주세요.</div>
                </div>

                <div class="collection-field mb-0">
                    <div class="d-flex justify-content-between align-items-center gap-3">
                        <label class="form-label" for="description">설명</label>
                        <span class="collection-field-count" aria-live="polite">
                            <span id="descriptionLength">0</span>/1000
                        </span>
                    </div>
                    <textarea id="description"
                              class="form-control collection-input collection-textarea"
                              rows="6"
                              maxlength="1000"
                              placeholder="이 컬렉션을 소개해 주세요"></textarea>
                </div>
            </section>

            <section class="collection-editor-panel"
                     aria-labelledby="selectedContentHeading">
                <div class="collection-section-heading align-items-end">
                    <div>
                        <p class="collection-section-number mb-1">02</p>
                        <h2 id="selectedContentHeading" class="collection-section-title mb-1">
                            담긴 작품
                        </h2>
                        <p class="collection-section-description mb-0">
                            작품은 추가한 순서대로 표시됩니다.
                        </p>
                    </div>
                    <button id="openContentSearchButton"
                            class="btn btn-outline-primary collection-add-button"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#contentSearchModal">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i>
                        작품 추가
                    </button>
                </div>

                <div class="collection-selection-summary" aria-live="polite">
                    선택한 작품 <strong id="selectedContentCount">0</strong>개
                </div>

                <div id="selectedContentList"
                     class="collection-selection-list"
                     aria-live="polite"></div>

                <div id="selectedContentEmpty" class="collection-empty-state">
                    <i class="bi bi-film collection-empty-icon" aria-hidden="true"></i>
                    <strong>아직 담긴 작품이 없습니다.</strong>
                    <span>작품 추가 버튼을 눌러 영화를 찾아보세요.</span>
                </div>
            </section>

            <div class="collection-editor-actions">
                <a id="cancelLink" class="btn btn-outline-secondary" th:href="@{/collections}">
                    취소
                </a>
                <button id="submitButton" class="btn btn-primary" type="submit">
                    컬렉션 만들기
                </button>
            </div>
        </form>
    </div>

    <div id="contentSearchModal"
         class="modal fade"
         tabindex="-1"
         aria-labelledby="contentSearchModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content collection-search-modal">
                <div class="modal-header">
                    <div>
                        <p class="collection-kicker mb-1">ADD MOVIES</p>
                        <h2 id="contentSearchModalLabel" class="modal-title fs-4">
                            작품 추가
                        </h2>
                    </div>
                    <button class="btn-close"
                            type="button"
                            data-bs-dismiss="modal"
                            aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div class="collection-search-box">
                        <i class="bi bi-search" aria-hidden="true"></i>
                        <label class="visually-hidden" for="contentSearchInput">
                            영화 제목 검색
                        </label>
                        <input id="contentSearchInput"
                               class="form-control"
                               type="search"
                               maxlength="100"
                               placeholder="영화 제목을 검색하세요">
                        <button id="searchContentButton"
                                class="btn btn-primary"
                                type="button">검색</button>
                    </div>

                    <div id="contentSelectionError"
                         class="alert alert-danger d-none mt-3"
                         role="alert"></div>

                    <div id="contentSearchLoading"
                         class="collection-search-loading d-none"
                         role="status"
                         aria-live="polite">
                        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                        작품을 찾고 있습니다.
                    </div>

                    <div id="contentSearchResults"
                         class="collection-search-results"
                         aria-live="polite"></div>

                    <div id="contentSearchEmpty"
                         class="collection-empty-state d-none">
                        <i class="bi bi-search collection-empty-icon" aria-hidden="true"></i>
                        <strong>검색된 작품이 없습니다.</strong>
                        <span>다른 제목으로 다시 검색해 보세요.</span>
                    </div>

                    <nav class="mt-3" aria-label="영화 검색 페이지">
                        <ul id="contentSearchPagination"
                            class="pagination pagination-sm justify-content-center mb-0"></ul>
                    </nav>
                </div>
                <div class="modal-footer">
                    <span class="me-auto text-secondary small">
                        선택 작품 <strong id="modalSelectedContentCount">0</strong>개
                    </span>
                    <button class="btn btn-primary" type="button" data-bs-dismiss="modal">
                        선택 완료
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
