<!DOCTYPE html>
<!--
Modification History
2026. 8. 29. jinyoung - 인증 요청 정리, 공개 여부 및 실제 콘텐츠 검색·선택 영역 추가
2026. 8. 31. jinyoung - D-04 작품 추가 모달과 미저장 변경 경고 연결
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
<title>컬렉션 등록·수정</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<!-- formMode와 collectionId는 등록·수정 공용 JavaScript가 동작을 구분하는 값이다. -->
<body class="bg-light"
      th:attr="data-form-mode=${formMode},data-collection-id=${collectionId}">
    <header class="border-bottom bg-white">
        <div class="container py-3">
            <a class="text-decoration-none text-dark fs-4 fw-bold" th:href="@{/collections}">
                Ending Credit
            </a>
        </div>
    </header>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h1 id="formTitle" class="h3 mb-4">컬렉션 등록</h1>

                        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                        <!-- 작성 회원은 서버 인증 정보로 결정하며 화면에서 입력받지 않는다. -->
                        <form id="collectionForm">
                            <div class="mb-3">
                                <label class="form-label" for="title">제목</label>
                                <input id="title" class="form-control" type="text"
                                       maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="description">설명</label>
                                <textarea id="description" class="form-control" rows="7"
                                          maxlength="1000"></textarea>
                                <div class="form-text text-end">
                                    <span id="descriptionLength">0</span>/1000
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input id="isPublic" class="form-check-input"
                                       type="checkbox" checked>
                                <label class="form-check-label" for="isPublic">
                                    공개 컬렉션
                                </label>
                                <div id="publicHelp" class="form-text">
                                    다른 사용자와 비회원도 이 컬렉션을 볼 수 있습니다.
                                </div>
                            </div>

                            <!-- DB에 저장된 콘텐츠를 제목으로 검색해 컬렉션 작품을 선택한다. -->
                            <section class="mb-4" aria-labelledby="selectedContentHeading">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h2 id="selectedContentHeading" class="h5 mb-0">
                                        작품 <span id="selectedContentCount">0</span>
                                    </h2>
                                    <button id="openContentSearchButton"
                                            class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal"
                                            data-bs-target="#contentSearchModal">
                                        + 작품 추가
                                    </button>
                                </div>

                                <div id="selectedContentList" class="list-group"
                                     aria-live="polite"></div>
                                <p id="selectedContentEmpty"
                                   class="border rounded p-3 text-center text-secondary mb-0">
                                    선택한 작품이 없습니다.
                                </p>
                                <p class="form-text mb-0">
                                    작품을 선택하지 않아도 컬렉션을 저장할 수 있습니다.
                                </p>
                            </section>

                            <div class="d-flex justify-content-end gap-2">
                                <a id="cancelLink" class="btn btn-outline-secondary"
                                   th:href="@{/collections}">취소</a>
                                <button id="submitButton" class="btn btn-dark" type="submit">
                                    등록
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 검색 결과 선택은 편집 상태에만 반영하며 닫기만으로 DB를 변경하지 않는다. -->
        <div id="contentSearchModal" class="modal fade" tabindex="-1"
             aria-labelledby="contentSearchModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="contentSearchModalLabel" class="modal-title fs-5">
                            컬렉션에 작품 추가
                        </h2>
                        <button class="btn-close" type="button" data-bs-dismiss="modal"
                                aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <label class="visually-hidden" for="contentSearchInput">
                                영화 제목 검색
                            </label>
                            <input id="contentSearchInput" class="form-control" type="search"
                                   maxlength="100" placeholder="영화 제목을 검색하세요">
                            <button id="searchContentButton" class="btn btn-outline-dark"
                                    type="button">검색</button>
                        </div>
                        <div id="contentSelectionError"
                             class="alert alert-danger d-none" role="alert"></div>
                        <div id="contentSearchResults" class="list-group mb-3"
                             aria-live="polite"></div>
                        <p id="contentSearchEmpty"
                           class="border rounded p-3 text-center text-secondary mb-3 d-none">
                            검색된 작품이 없습니다.
                        </p>
                        <nav aria-label="영화 검색 페이지">
                            <ul id="contentSearchPagination"
                                class="pagination pagination-sm justify-content-center mb-0"></ul>
                        </nav>
                    </div>
                    <div class="modal-footer">
                        <span class="me-auto text-secondary small">
                            선택 작품 <strong id="modalSelectedContentCount">0</strong>개
                        </span>
                        <button class="btn btn-dark" type="button" data-bs-dismiss="modal">
                            닫기
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/assets/js/cmn/common_fetch.js}"></script>
    <script th:src="@{/assets/js/bootstrap.js}"></script>
    <script th:src="@{/assets/js/collection/collection-form.js}"></script>
</body>
</html>
