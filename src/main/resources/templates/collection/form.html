<!DOCTYPE html>
<!--
Modification History
2026. 8. 29. jinyoung - 등록·수정·공개 여부·작품 검색 적용
2026. 8. 31. jinyoung - 작품 추가 모달과 미저장 변경 경고 적용
2026. 9. 01. jinyoung - 등록·수정 화면과 공개 정책 UI 적용
2026. 9. 02. jinyoung - 작품 추가·제거 흐름 개선
2026. 9. 05. jinyoung - 수정 화면 상단에 컬렉션 삭제 버튼·확인 모달 추가
-->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${formMode == 'update' ? '컬렉션 수정' : '새 컬렉션'}">새 컬렉션</title>
    <link rel="stylesheet" th:href="@{/assets/css/collection/common.css}">
    <link rel="stylesheet" th:href="@{/assets/css/collection/collection-form.css}">
    <script th:src="@{/assets/js/collection/collection-form.js}" defer></script>
</head>
<body>
<div layout:fragment="content"
     id="collectionFormPage"
     class="collection-page collection-editor-page"
     th:attr="data-form-mode=${formMode},data-collection-id=${collectionId}">
    <div class="collection-editor collection-detail-block collection-update-block">
        <!-- 화면 제목과 저장 버튼 -->
        <header class="collection-page-heading collection-update-heading">
			<div class="collection-update-actions">
				<button id="deleteCollectionButton"
						class="btn collection-update-delete-button"
						type="button"
						data-bs-toggle="modal"
						data-bs-target="#deleteCollectionFormModal"
						th:if="${formMode == 'update'}">삭제</button>
				<button id="submitButton" class="btn collection-update-submit-button" type="submit" form="collectionForm"
						th:text="${formMode == 'update' ? '수정 완료' : '만들기'}">
					만들기
				</button>
			</div>
            <h1 id="formTitle" class="collection-page-title mb-0"
                th:text="${formMode == 'update' ? '컬렉션 수정' : '새 컬렉션'}">
                새 컬렉션
            </h1>
        </header>

        <!-- 오류 안내 -->
        <div id="errorMessage" class="alert alert-danger d-none" role="alert" tabindex="-1"></div>

        <form id="collectionForm" novalidate>
            <!-- 컬렉션 기본 정보 -->
            <section class="collection-editor-panel" aria-labelledby="collectionInfoHeading">
                <h2 id="collectionInfoHeading" class="visually-hidden">컬렉션 정보</h2>

                <div class="collection-field collection-update-field">
                    <label class="visually-hidden" for="title">컬렉션 제목</label>
                    <div class="collection-visibility-row">
                        <label class="collection-visibility-control" for="isPublic">
                            <input id="isPublic" class="collection-visibility-input" type="checkbox" checked>
                            <span class="collection-visibility-check" aria-hidden="true">
                                <i class="bi bi-check-lg"></i>
                            </span>
                            <span id="collectionVisibilityText" class="collection-visibility-text">공개 컬렉션</span>
                        </label>
                    </div>
                    <input id="title" class="form-control collection-input" type="text" maxlength="100"
                           placeholder="컬렉션 타이틀" autocomplete="off"
                           required>
                    <div class="invalid-feedback">타이틀을 입력해 주세요.</div>
                    <div id="titleLengthWarning" class="collection-length-warning d-none" role="status"
                         aria-live="polite">
                        제목은 최대 100자까지 가능해요
                    </div>
                </div>

                <div class="collection-field collection-update-field mb-0">
                    <label class="visually-hidden" for="description">컬렉션 설명</label>
                    <textarea id="description" class="form-control collection-input collection-textarea"
                              rows="6" maxlength="1000"
                              placeholder="컬렉션에 대한 설명을 입력해 주세요."></textarea>
                    <div id="descriptionLengthWarning" class="collection-length-warning d-none" role="status"
                         aria-live="polite">
                        컬렉션 설명은 최대 1000자까지 가능해요
                    </div>
                </div>
            </section>

            <!-- 선택한 작품 -->
            <section class="collection-editor-panel" aria-labelledby="selectedContentHeading">
                <div class="collection-section-heading align-items-end collection-update-content-heading">
                    <h2 id="selectedContentHeading" class="collection-section-title mb-0">담긴 작품 <span id="selectedContentCount">0</span></h2>
                    <div class="collection-content-edit-controls">
                        <button id="toggleContentEditButton" class="collection-text-action"
                                type="button">수정하기</button>
                        <div id="contentEditActions" class="d-none">
                            <button id="cancelContentEditButton" class="collection-text-action"
                                    type="button">취소</button>
                            <button id="confirmContentRemovalButton" class="collection-text-action" type="button"
                                    disabled>
                                <span id="pendingRemovalCount">0</span>개 제거
                            </button>
                        </div>
                    </div>
                </div>

                <div id="selectedContentList" class="collection-selection-list" aria-live="polite"></div>
            </section>
        </form>
    </div>

    <!-- 작품 검색 모달 -->
    <div id="contentSearchModal" class="modal fade" tabindex="-1" aria-labelledby="contentSearchModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable collection-update-search-dialog">
            <div class="modal-content collection-search-modal">
                <div class="modal-header collection-update-search-header">
                    <button class="collection-modal-close-button" type="button" data-bs-dismiss="modal"
                            aria-label="닫기">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                    <div class="collection-update-search-title-row">
                        <h2 id="contentSearchModalLabel" class="modal-title">작품 추가</h2>
                        <button id="modalAddContentButton" class="collection-modal-add-button" type="button"
                                disabled>
                            <span id="pendingAdditionCount">0</span>개 추가하기
                        </button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="collection-search-box">
                        <i class="bi bi-search" aria-hidden="true"></i>
                        <label class="visually-hidden" for="contentSearchInput">영화 제목 검색</label>
                        <input id="contentSearchInput" class="form-control" type="search" maxlength="100"
                               placeholder="검색하여 작품 추가하기">
                        <button id="clearContentSearchButton" class="collection-search-clear-button d-none" type="button"
                                aria-label="검색어 지우기">
                            <i class="bi bi-x-lg" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div id="contentSelectionError" class="alert alert-danger d-none mt-3" role="alert"></div>

                    <div id="contentSearchLoading" class="collection-search-loading d-none" role="status"
                         aria-live="polite">
                        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                        작품을 찾고 있습니다.
                    </div>

                    <div id="contentSearchResults" class="collection-search-results" aria-live="polite"></div>

                    <div id="contentSearchEmpty" class="collection-empty-state d-none">
                        <i class="bi bi-search collection-empty-icon" aria-hidden="true"></i>
                        <strong>검색된 작품이 없습니다.</strong>
                        <span>다른 제목으로 다시 검색해 보세요.</span>
                    </div>

                    <nav class="mt-3" aria-label="영화 검색 페이지">
                        <ul id="contentSearchPagination" class="pagination pagination-sm justify-content-center mb-0"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- 빈 컬렉션 등록 확인 모달 -->
    <div id="emptyCollectionConfirmModal" class="modal fade" tabindex="-1" aria-labelledby="emptyCollectionConfirmTitle"
         aria-hidden="true"
         th:if="${formMode == 'create'}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content collection-delete-modal">
                <button type="button" class="btn-close collection-delete-close" data-bs-dismiss="modal"
                        aria-label="닫기"></button>
                <div class="modal-body">
                    <div class="collection-empty-confirm-copy">
                        <p id="emptyCollectionConfirmTitle" class="collection-delete-question">담긴 작품이 없습니다.</p>
                        <p class="collection-delete-description">이대로 컬렉션만 등록할까요?</p>
                    </div>
                    <div class="collection-delete-actions">
                        <button type="button" class="btn collection-delete-button collection-delete-cancel"
                                data-bs-dismiss="modal">작품 담기</button>
                        <button id="confirmEmptyCollectionButton" type="button"
                                class="btn collection-delete-button collection-empty-confirm-submit">
                            등록
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

	<!-- 수정 화면 컬렉션 삭제 확인 모달 -->
	<div id="deleteCollectionFormModal"
		 class="modal fade"
		 tabindex="-1"
		 aria-label="컬렉션 삭제 확인"
		 aria-hidden="true"
		 th:if="${formMode == 'update'}">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content collection-delete-modal">
				<button type="button" class="btn-close collection-delete-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				<div class="modal-body">
					<div class="collection-form-delete-icon" aria-hidden="true">
						<i class="bi bi-trash3"></i>
					</div>
					<p class="collection-delete-question">해당 컬렉션을 삭제할까요?</p>
					<p class="collection-delete-description">컬렉션에 기록된 좋아요와 댓글 기록이 모두 삭제되며 되돌릴 수 없습니다.</p>
					<div class="collection-delete-actions">
						<button type="button" class="btn collection-delete-button collection-delete-cancel"
								data-bs-dismiss="modal">취소</button>
						<button id="confirmDeleteCollectionButton" type="button"
								class="btn btn-danger collection-delete-button">삭제</button>
					</div>
				</div>
			</div>
		</div>
	</div>

    <!-- 저장 필요 안내 -->
    <div class="collection-save-notice">
        <div id="collectionSaveNoticeToast" class="toast collection-save-notice-toast" role="status"
             aria-live="polite" aria-atomic="true"
             data-bs-delay="3500">
            <div class="toast-body">상단에 ‘수정 완료’ 버튼을 눌러야 수정이 반영돼요.</div>
        </div>
    </div>
</div>
</body>
</html>
