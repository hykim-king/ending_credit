<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>공지 상세 | END IT</title>
    <link rel="stylesheet" href="/assets/css/notice/notice.css">
</head>
<body layout:fragment="content" data-page="notice-detail" th:attr="data-notice-id=${noticeId}">


<main class="notice-container">
    <button type="button" id="backButton" class="outline-button mb-3">목록으로</button>

    <article class="notice-detail-card">
        <div id="detailLoading" class="notice-state">공지사항을 불러오는 중입니다.</div>

        <div id="detailContent" hidden>
            <div class="detail-title-wrap">
                <span id="detailImportant" class="important-label" hidden>중요</span>
                <h1 id="detailTitle" class="detail-title"></h1>
            </div>

            <div class="detail-meta">
                <span id="detailCreatedDt"></span>
                <span>조회 <strong id="detailViewCount"></strong></span>
            </div>

            <div id="detailBody" class="detail-body"></div>
        </div>

        <div id="detailError" class="notice-state" hidden>
            게시된 공지사항을 찾을 수 없습니다.
        </div>
    </article>
</main>

<script src="/assets/js/notice/notice.js"></script>
</body>
</html>
