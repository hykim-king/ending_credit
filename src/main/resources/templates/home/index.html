<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{home.title}">홈</title>
<style>
    /* 캐러셀 - detail.html 갤러리와 같은 골격(clip + track + translateX) */
    /* 선반 사이 간격. 부트스트랩 mb-5(3rem)에서 3분의 1쯤 줄였다 */
    .shelf-section {
        margin-bottom: 2rem;
    }
    .shelf-viewport {
        position: relative;
        /* 칸 수는 선반마다 다르다. 컨트롤러 값을 th:style로 덮어쓰며 여기 값은 폴백이다.
           칸 너비(CSS)와 캐러셀 이동량(JS)이 이 한 값을 같이 읽는다 */
        --per-view: 5;
        --gap: 16px;
    }
    .shelf-clip {
        overflow: hidden;
    }
    .shelf-track {
        display: flex;
        gap: var(--gap);
        transition: transform .3s ease;
    }
    /* 칸 사이 간격 (칸수-1)개를 뺀 나머지를 칸 수로 나눈다.
       min-width:0이 없으면 긴 단어가 든 제목("Thundermans")이 min-content를 밀어 올려
       그 칸만 넓어진다 - 플렉스 아이템의 기본값이 min-width:auto라서다 */
    .shelf-item {
        flex: 0 0 calc((100% - (var(--per-view) - 1) * var(--gap)) / var(--per-view));
        min-width: 0;
    }
    .shelf-nav {
        position: absolute;
        /* 포스터 세로 중앙. JS가 포스터 실측 높이로 채우며, 못 채우면 칸 전체 기준으로 떨어진다 */
        top: var(--nav-top, 50%);
        transform: translateY(-50%);
        /* 접근성 원칙의 44px 터치 영역은 유지하고, 보이는 원만 ::before로 작게 그린다 */
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: none;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 1;
        cursor: pointer;
        z-index: 2;
    }
    .shelf-nav::before {
        content: "";
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
    }
    /* ::before가 위치를 잡으면 아이콘보다 나중에 칠해지므로, 아이콘도 올려서 원 위에 얹는다 */
    .shelf-nav > i {
        position: relative;
    }
    /* 본문 폭(1200px)밖으로 나가면 잘리므로 안쪽에 겹쳐 둔다 */
    .shelf-prev {
        left: 0;
    }
    .shelf-next {
        right: 0;
    }
    /* display:flex가 hidden을 덮어쓰므로 명시적으로 막는다.
       한 화면에 다 들어갈 때와, 넘어갈 쪽이 없을 때 둘 다 감춘다 */
    .shelf-nav[hidden] {
        display: none;
    }
    .shelf-nav:focus-visible, .movie-card:focus-visible {
        outline: 3px solid #D8D1FF;
    }

    .movie-card {
        display: block;
        color: inherit;
        text-decoration: none;
    }
    /* 순위 배지를 포스터에 겹치기 위한 기준 상자 */
    .poster-wrap {
        position: relative;
    }
    /* 인기 순 선반에만 붙는다. 두 자리 순위도 들어가도록 폭을 고정하지 않고 min-width로 연다 */
    .rank-badge {
        position: absolute;
        top: 0;
        left: 0;
        min-width: 30px;
        height: 30px;
        padding: 0 7px;
        background: rgba(0, 0, 0, .78);
        color: #fff;
        font-size: .95rem;
        font-weight: 700;
        line-height: 30px;
        text-align: center;
        /* 포스터의 8px 라운드와 만나는 바깥쪽 두 모서리만 둥글게 */
        border-radius: 8px 0 8px 0;
    }
    .movie-card img, .poster-empty {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 8px;
        background-color: #ECEAF2;
        display: block;
    }
    /* 포스터 URL 자체가 없는 경우 */
    .poster-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6B6577;
        font-size: .8rem;
    }
    /* 로딩에 실패한 포스터는 빈 자리와 같은 회색 판으로 남긴다 */
    .poster-error {
        background-color: #ECEAF2;
    }
    .card-title {
        margin: .5rem 0 .15rem;
        font-size: .95rem;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .card-meta {
        margin: 0;
        font-size: .875rem;
        color: #5B5867;
    }
    /* 회색 메타 줄에서 별점만 도드라져야 한다. 상세의 .rating-average i와 같은 브랜드색을 쓴다 */
    .card-rating {
        /* 굵어서 연도(.875rem)보다 커 보인다. 한 단계 내려 무게만 남긴다 */
        font-size: .8125rem;
        color: var(--endit-primary);
        font-weight: 600;
    }
    /* 색도 무게도 별·숫자와 같이 간다 - 라벨만 얇으면 별과 따로 노는 덩어리로 읽힌다 */
    .card-rating-label {
        margin-right: 3px;
    }
    .card-rating i {
        font-size: .8em;
        margin-right: 2px;
    }
    /* bootstrap-icons가 .bi::before에 vertical-align: -.125em을 걸어 별만 내려앉는다 */
    .card-rating i::before {
        vertical-align: 0;
    }

    /* 좁은 화면에서는 선반마다 다른 칸 수(박스오피스 5 / 큐레이션 7)를 버리고 모두 같은 수로 맞춘다 -
       7칸을 그대로 두면 포스터가 엄지손톱만 해지고 줄마다 카드 크기가 달라 보인다.
       컨트롤러가 th:style로 심은 인라인 값을 이겨야 해서 !important를 쓴다.
       JS도 이 변수를 읽어 이동량을 정하므로 화살표 한 번에 한 화면씩 그대로 넘어간다 */
    @media (max-width: 991.98px) {
        .shelf-viewport {
            --per-view: 4 !important;
        }
    }
    @media (max-width: 767.98px) {
        .shelf-viewport {
            --per-view: 3 !important;
            --gap: 12px;
        }
        .card-title {
            font-size: .875rem;
        }
        .card-meta, .card-rating {
            font-size: .8125rem;
        }
    }
    /* 더 좁아져도 3칸을 유지한다 - 2칸이면 포스터가 화면 반쪽씩 차지해 한 줄에 두 편만 보인다.
       대신 글자와 간격을 한 번 더 줄여 3칸이 들어갈 자리를 만든다 */
    @media (max-width: 479.98px) {
        .shelf-viewport {
            --gap: 8px;
        }
        .card-title {
            font-size: .8125rem;
            margin-top: .35rem;
        }
        .card-meta, .card-rating {
            font-size: .75rem;
        }
        .rank-badge {
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            font-size: .8rem;
            line-height: 22px;
        }
        /* 44px 터치 영역은 유지하고 보이는 원만 더 작게 그린다 */
        .shelf-nav::before {
            width: 26px;
            height: 26px;
        }
    }

    /* 선반이 여섯 줄이라 아래로 내려가면 헤더가 멀다. 스크롤이 THRESHOLD를 넘을 때만 JS가 띄운다 */
    .scroll-top {
        position: fixed;
        right: 24px;
        bottom: 24px;
        /* 접근성 원칙의 44px 터치 영역. 원 자체를 그만큼 그린다 */
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: var(--endit-primary);
        color: #fff;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        cursor: pointer;
        z-index: 3;
    }
    .scroll-top:hover {
        background: var(--endit-hover);
    }
    .scroll-top:active {
        background: var(--endit-active);
    }
    .scroll-top:focus-visible {
        outline: 3px solid #D8D1FF;
        outline-offset: 2px;
    }
    /* display:flex가 hidden을 덮어쓴다(.shelf-nav과 같은 함정) */
    .scroll-top[hidden] {
        display: none;
    }
</style>
</head>
<body>
    <div layout:fragment="content">

        <p th:if="${#lists.isEmpty(shelves)}" class="text-muted">
            <span th:text="#{home.empty}">아직 보여드릴 작품이 없습니다.</span>
        </p>

        <!-- 선반은 여기서 한 벌만 그린다. 줄을 늘리려면 컨트롤러에서 addShelf를 한 번 더 부르면 된다 -->
        <section class="shelf-section" th:each="shelf : ${shelves}">

            <h5 class="mb-3" th:text="${shelf.title}">선반 제목</h5>

            <div class="shelf-viewport" th:style="|--per-view:${shelf.perView}|">
                <button type="button" class="shelf-nav shelf-prev" th:aria-label="#{home.carousel.prev}" aria-label="이전">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <div class="shelf-clip">
                    <div class="shelf-track">
                        <div class="shelf-item" th:each="movie : ${shelf.movies}">
                            <a class="movie-card" th:href="@{/movies/{id}(id=${movie.contentId})}">

                                <div class="poster-wrap">
                                    <img th:if="${!#strings.isEmpty(movie.posterUrl)}"
                                         th:src="${movie.posterUrl}"
                                         th:alt="${@localeText.get(movie.titleKo, movie.titleOrg)}"
                                         loading="lazy"
                                         onerror="this.onerror = null; this.classList.add('poster-error');">
                                    <div th:if="${#strings.isEmpty(movie.posterUrl)}" class="poster-empty" th:text="#{home.card.noImage}">이미지 없음</div>

                                    <!-- no는 인기 순 경로에서만 순위 숫자다(ContentServiceImpl.retrievePopular) -->
                                    <span th:if="${shelf.ranked}" class="rank-badge" th:text="${movie.no}">1</span>
                                </div>

                                <p class="card-title"
                                   th:text="${@localeText.get(movie.titleKo, movie.titleOrg)}">제목</p>

                                <!-- 평균이 없는(아직 아무도 평가 안 한) 영화는 연도만 남는다.
                                     score는 소수점이 0이면 자리를 떼고(4.0 -> 4) 아니면 한 자리로 고정한다 -->
                                <p class="card-meta"
                                   th:with="year=${movie.releaseYearLabel != null ? movie.releaseYearLabel : ''},
                                            average=${ratingAverages.get(movie.contentId)},
                                            score=${average == null ? null
                                                    : (average % 1 == 0 ? #numbers.formatInteger(average, 1)
                                                                        : #numbers.formatDecimal(average, 1, 1))}">
                                    <span th:if="${!#strings.isEmpty(year)}" th:text="${year}">2024</span>
                                    <span th:if="${!#strings.isEmpty(year) and average != null}"> · </span>
                                    <span th:if="${average != null}" class="card-rating">
                                        <span class="card-rating-label" th:text="#{home.card.rating}">평균</span><i
                                            class="bi bi-star-fill" aria-hidden="true"></i><span
                                            th:text="${score}">4.1</span>
                                    </span>
                                </p>

                            </a>
                        </div>
                    </div>
                </div>

                <button type="button" class="shelf-nav shelf-next" th:aria-label="#{home.carousel.next}" aria-label="다음">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>

        </section>

        <!-- 맨 위로. 처음에는 감춰 두고 스크롤이 내려간 뒤에만 JS가 띄운다 -->
        <button type="button" class="scroll-top" id="scrollTopButton" hidden
                th:aria-label="#{home.scrollTop}" aria-label="맨 위로">
            <i class="bi bi-arrow-up" aria-hidden="true"></i>
        </button>

        <script th:src="@{/assets/js/common/carousel.js}"></script>
        <script>
            // 선반마다 독립 인스턴스로 돈다 - 한 벌만 걸면 첫 줄만 움직인다
            document.addEventListener('DOMContentLoaded', function () {
                var FALLBACK_VISIBLE_COUNT = 5;
                var FALLBACK_GAP = 16;

                // 캐러셀 골격은 assets/js/common/carousel.js 한 벌을 쓴다 -
                // 상세의 갤러리·담긴 컬렉션과 같은 것이라 여기에 다시 적지 않는다.
                // 섹션이 여러 줄로 늘어나도 각 줄이 자기 인스턴스를 갖는다
                document.querySelectorAll('.shelf-viewport').forEach(function (shelf) {
                    window.enditCarousel.create({
                        viewport: shelf,
                        track: shelf.querySelector('.shelf-track'),
                        prevBtn: shelf.querySelector('.shelf-prev'),
                        nextBtn: shelf.querySelector('.shelf-next'),
                        perViewVar: '--per-view',
                        gapVar: '--gap',
                        perViewFallback: FALLBACK_VISIBLE_COUNT,
                        gapFallback: FALLBACK_GAP,
                        onUpdate: window.enditCarousel.centerNavOn('.poster-wrap')
                    });
                });

                // 선반 여섯 줄이라 아래에서 헤더까지 되돌아가는 거리가 길다
                var SCROLL_TOP_THRESHOLD = 150;
                var topButton = document.getElementById('scrollTopButton');

                function updateTopButton() {
                    topButton.hidden = window.scrollY < SCROLL_TOP_THRESHOLD;
                }

                if (topButton) {
                    // 스크롤마다 부르므로 passive로 둔다 - 여기서 기본 동작을 막을 일이 없다
                    window.addEventListener('scroll', updateTopButton, { passive: true });
                    topButton.addEventListener('click', function () {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    // 새로고침이 화면 중간에서 되살아나는 경우가 있어 처음에도 한 번 본다
                    updateTopButton();
                }
            });
        </script>

    </div>
</body>
</html>
