<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{home.title}">홈</title>
<style>
    /* 캐러셀 - detail.html 갤러리와 같은 골격(clip + track + translateX) */
    /* 선반 사이 간격. 부트스트랩 mb-5(3rem)에서 3분의 1쯤 줄였다 */
    .shelf-section {
        margin-bottom: 2rem;
    }
    .shelf-viewport {
        position: relative;
        /* 칸 수는 선반마다 다르다. 컨트롤러 값을 th:style로 덮어쓰며 여기 값은 폴백이다.
           칸 너비(CSS)와 캐러셀 이동량(JS)이 이 한 값을 같이 읽는다 */
        --per-view: 5;
        --gap: 16px;
    }
    .shelf-clip {
        overflow: hidden;
    }
    .shelf-track {
        display: flex;
        gap: var(--gap);
        transition: transform .3s ease;
    }
    /* 칸 사이 간격 (칸수-1)개를 뺀 나머지를 칸 수로 나눈다 */
    .shelf-item {
        flex: 0 0 calc((100% - (var(--per-view) - 1) * var(--gap)) / var(--per-view));
    }
    .shelf-nav {
        position: absolute;
        /* 포스터 세로 중앙. JS가 포스터 실측 높이로 채우며, 못 채우면 칸 전체 기준으로 떨어진다 */
        top: var(--nav-top, 50%);
        transform: translateY(-50%);
        /* 접근성 원칙의 44px 터치 영역은 유지하고, 보이는 원만 ::before로 작게 그린다 */
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: none;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 1;
        cursor: pointer;
        z-index: 2;
    }
    .shelf-nav::before {
        content: "";
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
    }
    /* ::before가 위치를 잡으면 아이콘보다 나중에 칠해지므로, 아이콘도 올려서 원 위에 얹는다 */
    .shelf-nav > i {
        position: relative;
    }
    /* 본문 폭(1200px)밖으로 나가면 잘리므로 안쪽에 겹쳐 둔다 */
    .shelf-prev {
        left: 0;
    }
    .shelf-next {
        right: 0;
    }
    /* display:flex가 hidden을 덮어쓰므로 명시적으로 막는다.
       한 화면에 다 들어갈 때와, 넘어갈 쪽이 없을 때 둘 다 감춘다 */
    .shelf-nav[hidden] {
        display: none;
    }
    .shelf-nav:focus-visible, .movie-card:focus-visible {
        outline: 3px solid #D8D1FF;
    }

    .movie-card {
        display: block;
        color: inherit;
        text-decoration: none;
    }
    /* 순위 배지를 포스터에 겹치기 위한 기준 상자 */
    .poster-wrap {
        position: relative;
    }
    /* 인기 순 선반에만 붙는다. 두 자리 순위도 들어가도록 폭을 고정하지 않고 min-width로 연다 */
    .rank-badge {
        position: absolute;
        top: 0;
        left: 0;
        min-width: 30px;
        height: 30px;
        padding: 0 7px;
        background: rgba(0, 0, 0, .78);
        color: #fff;
        font-size: .95rem;
        font-weight: 700;
        line-height: 30px;
        text-align: center;
        /* 포스터의 8px 라운드와 만나는 바깥쪽 두 모서리만 둥글게 */
        border-radius: 8px 0 8px 0;
    }
    .movie-card img, .poster-empty {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 8px;
        background-color: #ECEAF2;
        display: block;
    }
    /* 포스터 URL 자체가 없는 경우 */
    .poster-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6B6577;
        font-size: .8rem;
    }
    /* 로딩에 실패한 포스터는 빈 자리와 같은 회색 판으로 남긴다 */
    .poster-error {
        background-color: #ECEAF2;
    }
    .card-title {
        margin: .5rem 0 .15rem;
        font-size: .95rem;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .card-meta {
        margin: 0;
        font-size: .875rem;
        color: #5B5867;
    }
</style>
</head>
<body>
    <div layout:fragment="content">

        <p th:if="${#lists.isEmpty(shelves)}" class="text-muted">
            <span th:text="#{home.empty}">아직 보여드릴 작품이 없습니다.</span>
        </p>

        <!-- 선반은 여기서 한 벌만 그린다. 줄을 늘리려면 컨트롤러에서 addShelf를 한 번 더 부르면 된다 -->
        <section class="shelf-section" th:each="shelf : ${shelves}">

            <h5 class="mb-3" th:text="${shelf.title}">선반 제목</h5>

            <div class="shelf-viewport" th:style="|--per-view:${shelf.perView}|">
                <button type="button" class="shelf-nav shelf-prev" th:aria-label="#{home.carousel.prev}" aria-label="이전">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <div class="shelf-clip">
                    <div class="shelf-track">
                        <div class="shelf-item" th:each="movie : ${shelf.movies}">
                            <a class="movie-card" th:href="@{/movies/{id}(id=${movie.contentId})}">

                                <div class="poster-wrap">
                                    <img th:if="${!#strings.isEmpty(movie.posterUrl)}"
                                         th:src="${movie.posterUrl}"
                                         th:alt="${@localeText.get(movie.titleKo, movie.titleOrg)}"
                                         loading="lazy"
                                         onerror="this.onerror = null; this.classList.add('poster-error');">
                                    <div th:if="${#strings.isEmpty(movie.posterUrl)}" class="poster-empty" th:text="#{home.card.noImage}">이미지 없음</div>

                                    <!-- no는 인기 순 경로에서만 순위 숫자다(ContentServiceImpl.retrievePopular) -->
                                    <span th:if="${shelf.ranked}" class="rank-badge" th:text="${movie.no}">1</span>
                                </div>

                                <p class="card-title"
                                   th:text="${@localeText.get(movie.titleKo, movie.titleOrg)}">제목</p>

                                <!-- 국가는 박스오피스 선반만 쓴다 -->
                                <p class="card-meta"
                                   th:with="year=${movie.releaseYearLabel != null ? movie.releaseYearLabel : ''},
                                            country=${shelf.countryShown ? movie.country : ''}">
                                    <span th:if="${!#strings.isEmpty(year)}" th:text="${year}">2024</span>
                                    <span th:if="${!#strings.isEmpty(year) and !#strings.isEmpty(country)}"> · </span>
                                    <span th:if="${!#strings.isEmpty(country)}" th:text="${country}">국가</span>
                                </p>

                            </a>
                        </div>
                    </div>
                </div>

                <button type="button" class="shelf-nav shelf-next" th:aria-label="#{home.carousel.next}" aria-label="다음">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>

        </section>

        <script>
            // 선반마다 독립 인스턴스로 돈다. detail.html의 갤러리 캐러셀은 querySelector 단일 전제라
            // 섹션이 여러 줄로 늘어나는 순간 첫 줄만 움직인다 - 그 함정을 여기서 피해 둔다
            document.addEventListener('DOMContentLoaded', function () {
                var FALLBACK_VISIBLE_COUNT = 5;
                var FALLBACK_GAP = 16;

                // 칸 수와 간격은 CSS 변수가 유일한 출처다. 여기서 다시 적으면 선반마다 다른 값과 어긋난다
                function readVar(el, name, fallback) {
                    var value = parseInt(getComputedStyle(el).getPropertyValue(name), 10);
                    return isNaN(value) ? fallback : value;
                }

                document.querySelectorAll('.shelf-viewport').forEach(function (shelf) {
                    var track = shelf.querySelector('.shelf-track');
                    var prevBtn = shelf.querySelector('.shelf-prev');
                    var nextBtn = shelf.querySelector('.shelf-next');
                    if (!track || !prevBtn || !nextBtn) {
                        return;
                    }

                    var visibleCount = readVar(shelf, '--per-view', FALLBACK_VISIBLE_COUNT);
                    var gap = readVar(shelf, '--gap', FALLBACK_GAP);

                    var items = track.children;
                    // 한 화면에 다 들어가면 화살표를 띄우지 않는다
                    if (items.length <= visibleCount) {
                        prevBtn.hidden = true;
                        nextBtn.hidden = true;
                        return;
                    }

                    var startIndex = 0;
                    var poster = shelf.querySelector('.poster-wrap');

                    function update() {
                        var itemWidth = items[0].getBoundingClientRect().width;

                        // 화살표는 포스터 세로 중앙에 둔다 - 제목·연도까지 포함한 칸의 중앙은 포스터보다 아래로 내려간다.
                        // 포스터 높이는 aspect-ratio로 정해지므로 이미지 로딩을 기다릴 필요가 없다
                        if (poster) {
                            shelf.style.setProperty('--nav-top',
                                    (poster.getBoundingClientRect().height / 2) + 'px');
                        }

                        track.style.transform = 'translateX(-' + (startIndex * (itemWidth + gap)) + 'px)';
                        // 넘어갈 쪽이 없으면 흐리게 두지 않고 감춘다
                        prevBtn.hidden = startIndex === 0;
                        nextBtn.hidden = startIndex + visibleCount >= items.length;
                    }

                    prevBtn.addEventListener('click', function () {
                        startIndex = Math.max(0, startIndex - visibleCount);
                        update();
                    });
                    nextBtn.addEventListener('click', function () {
                        startIndex = Math.min(items.length - visibleCount, startIndex + visibleCount);
                        update();
                    });
                    // 창 크기가 바뀌면 칸 너비가 달라지므로 위치를 다시 계산한다
                    window.addEventListener('resize', update);

                    update();
                });
            });
        </script>

    </div>
</body>
</html>
