<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--시큐리티 미도입 상태에서는 _csrf가 null이라 무가드 참조 시 전 페이지 500 — th:if로 가드-->
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/assets/css/endit.css}">
<link rel="stylesheet" th:href="@{/assets/css/ai/ai_assistant.css}">
<title layout:title-pattern="$CONTENT_TITLE | ENDIT">ENDIT</title>
<script th:src="@{/assets/js/cmn/common.js}" defer></script>
<script th:src="@{/assets/js/cmn/common_fetch.js}" defer></script>
</head>
<body>
    <!-- root container -->
	<div>
		<div class="d-flex flex-column border min-vh-100">
			<!-- Header -->
			<header th:replace="~{fragments/header :: header}">Header</header>
			<!--// Header end -->

			<!-- Main (본문 폭 1200px — 설계서 p.5) -->
			<main class="flex-grow-1 p-3 endit-main">
				<div layout:fragment="content">
				</div>
			</main>
			<!--// Main end-->

			<!-- Footer -->
			<footer th:replace="~{fragments/footer :: footer}">Footer</footer>
			<!--// Footer end -->

		</div>
	</div>
	<!--// root container end -->

	<!-- AI 도우미 - 모든 화면에 뜨는 검색 버튼. 화면 구성에는 영향을 주지 않는다 -->
	<div th:replace="~{fragments/ai_assistant :: aiAssistant}"></div>

<script th:src="@{/assets/js/bootstrap.js}"></script>
<script th:src="@{/assets/js/ai/ai_assistant.js}" defer></script>
</body>
</html>
