<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/assets/css/endit.css}">
    <title layout:title-pattern="$CONTENT_TITLE | ENDIT">ENDIT</title>
    <script th:src="@{/assets/js/cmn/common.js}" defer></script>
    <script th:src="@{/assets/js/cmn/common_fetch.js}" defer></script>
</head>
<body>

    <!-- 헤더·푸터 없이 가운데 정렬된 인증 박스만 -->
    <main class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="w-100" style="max-width: 420px;">
            <div layout:fragment="content">
            </div>
        </div>
    </main>

    <script th:src="@{/assets/js/bootstrap.js}"></script>
</body>
</html>
