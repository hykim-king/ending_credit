<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>코멘트</title>
</head>
<body>
<div layout:fragment="content">

    <!--상단: 제목 + 정렬(FilterSortBar) + 작성 버튼 (설계서 C-04)-->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
            <h3 class="mb-0 fw-bold">코멘트</h3>
            <span class="text-muted filter-bar">영화·컬렉션 한줄평</span>
        </div>
        <div class="d-flex align-items-end gap-2">
            <div>
                <label for="memberId" class="form-label mb-0 filter-bar text-muted">회원ID (로그인 연동 전)</label>
                <input type="number" id="memberId" class="form-control form-control-sm" value="9" min="1">
            </div>
            <button type="button" class="btn btn-primary" id="btnOpenSave">코멘트 작성</button>
        </div>
    </div>
    <!--//상단-->

    <!--검색·정렬 바-->
    <form id="searchForm" th:action="@{/comment/doRetrieve}" method="get" class="row g-1 mb-3 filter-bar">
        <input type="hidden" name="pageNo" id="pageNo" th:value="${dto.pageNo}">
        <div class="col-auto">
            <select name="searchDiv" id="searchDiv" class="form-select form-select-sm">
                <option value=""  th:selected="${dto.searchDiv == ''}">전체</option>
                <option value="10" th:selected="${dto.searchDiv == '10'}">작성자 회원ID</option>
                <option value="20" th:selected="${dto.searchDiv == '20'}">영화ID</option>
                <option value="30" th:selected="${dto.searchDiv == '30'}">컬렉션ID</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="searchWord" id="searchWord" class="form-control form-control-sm"
                   placeholder="번호 입력" th:value="${dto.searchWord}">
        </div>
        <div class="col-auto">
            <select name="sort" id="sort" class="form-select form-select-sm">
                <option value="latest"      th:selected="${dto.searchMap['sort'] == 'latest'}">최신순</option>
                <option value="likes"       th:selected="${dto.searchMap['sort'] == 'likes'}">좋아요순</option>
                <option value="rating_desc" th:selected="${dto.searchMap['sort'] == 'rating_desc'}">높은 평점순</option>
                <option value="rating_asc"  th:selected="${dto.searchMap['sort'] == 'rating_asc'}">낮은 평점순</option>
            </select>
        </div>
        <div class="col-auto">
            <select name="pageSize" id="pageSize" class="form-select form-select-sm">
                <option value="10" th:selected="${dto.pageSize == 10}">10개</option>
                <option value="20" th:selected="${dto.pageSize == 20}">20개</option>
                <option value="30" th:selected="${dto.pageSize == 30}">30개</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="doSearch(1)">검색</button>
        </div>
    </form>
    <!--//검색·정렬 바-->

    <!--CommentCard 목록 (CMP-10)-->
    <div id="commentTbody">
        <div th:if="${#lists.isEmpty(list)}" class="comment-card text-center text-muted py-5">
            아직 코멘트가 없어요. 첫 코멘트를 남겨 보세요.
        </div>
        <div class="comment-card" th:each="vo : ${list}"
             th:attr="data-comment-id=${vo.commentId},data-detail=${vo.commentDetail},data-spoiler=${vo.spoiler},data-content-id=${vo.contentId},data-collection-id=${vo.collectionId},data-member-id=${vo.memberId}">
            <!--카드 머리: 아바타 + 닉네임 + 별점-->
            <div class="d-flex align-items-center gap-2 mb-2">
                <span class="avatar-circle" th:text="${#strings.substring(vo.nickname,0,1)}">닉</span>
                <div>
                    <div class="fw-bold" th:text="${vo.nickname}">작성자</div>
                    <div class="filter-bar text-muted" th:text="${vo.createdDt}">2026/08/25</div>
                </div>
                <span class="ms-auto star" th:if="${vo.ratingScore != null}"
                      th:text="|★ ${vo.ratingScore}|">★ 5</span>
            </div>
            <!--본문 (스포일러 가림 C-08: 메타는 유지, 본문만 안내 문구로 대체)-->
            <p class="mb-2">
                <span class="spoiler-guard" th:if="${vo.spoiler == 'Y'}">
                    <span class="text-muted">스포일러가 포함된 코멘트예요.</span>
                    <button type="button" class="btn btn-outline-secondary btn-sm spoiler-btn ms-1">내용 보기</button>
                    <span class="real-detail d-none" th:text="${vo.commentDetail}">본문</span>
                </span>
                <span th:unless="${vo.spoiler == 'Y'}" th:text="${vo.commentDetail}">본문</span>
            </p>
            <!--카드 발: ♡ · 신고 · (내 것) 수정 · 삭제-->
            <div class="d-flex align-items-center gap-3 filter-bar">
                <button type="button" class="like-btn" th:attr="data-comment-id=${vo.commentId}">
                    <i class="bi bi-heart"></i> <span class="like-cnt" th:text="${vo.likeCnt}">0</span>
                </button>
                <button type="button" class="card-action report-btn"><i class="bi bi-flag"></i> 신고</button>
                <span class="ms-auto"></span>
                <button type="button" class="card-action edit-btn"><i class="bi bi-pencil"></i> 수정</button>
                <button type="button" class="card-action danger del-btn"><i class="bi bi-trash"></i> 삭제</button>
            </div>
        </div>
    </div>
    <!--//CommentCard 목록-->

    <!--페이징 (CMP-19)-->
    <nav th:if="${pageDTO.totalCnt > 0}" aria-label="페이지" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center">
            <li class="page-item" th:classappend="${!pageDTO.pre} ? 'disabled'">
                <a class="page-link" href="#" th:onclick="|doSearch(${pageDTO.startNo - 1})|">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(pageDTO.startNo, pageDTO.endNo)}"
                th:classappend="${i == dto.pageNo} ? 'active'">
                <a class="page-link" href="#" th:onclick="|doSearch(${i})|" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${!pageDTO.next} ? 'disabled'">
                <a class="page-link" href="#" th:onclick="|doSearch(${pageDTO.endNo + 1})|">다음</a>
            </li>
        </ul>
    </nav>
    <!--//페이징-->

    <!--코멘트 작성·수정 모달 (C-07 / MOD-02·16)-->
    <div class="modal fade" id="commentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="commentModalTitle">코멘트 작성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="cmMode" value="save">
                    <input type="hidden" id="cmCommentId" value="0">
                    <div class="row g-2 mb-2" id="cmTargetRow">
                        <div class="col-6">
                            <label for="cmTargetType" class="form-label filter-bar">대상 구분</label>
                            <select id="cmTargetType" class="form-select form-select-sm">
                                <option value="content" selected>영화</option>
                                <option value="collection">컬렉션</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="cmTargetId" class="form-label filter-bar">대상 ID (테스트용 직접 입력)</label>
                            <input type="number" id="cmTargetId" class="form-control form-control-sm" min="1" placeholder="예: 9">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label for="cmDetail" class="form-label filter-bar">내용</label>
                        <textarea id="cmDetail" class="form-control" rows="4" maxlength="1000"
                                  placeholder="영화·컬렉션에 대한 생각을 남겨 보세요."></textarea>
                        <div class="text-end filter-bar text-muted"><span id="cmCount">0</span> / 1,000</div>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cmSpoiler">
                        <label class="form-check-label filter-bar" for="cmSpoiler">스포일러가 포함되어 있어요</label>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-end gap-1">
                    <button type="button" class="btn btn-danger d-none" id="btnCmDelete">삭제</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btnCmSave">저장</button>
                </div>
            </div>
        </div>
    </div>
    <!--//코멘트 작성·수정 모달-->

    <!--신고 모달 (MOD-04) — 사유는 공통코드(REPORT_REASON) 렌더링-->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">코멘트 신고</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="rpCommentId" value="0">
                    <div class="mb-2">
                        <label for="rpReason" class="form-label filter-bar">신고 사유</label>
                        <select id="rpReason" class="form-select form-select-sm">
                            <option th:each="code : ${reasonList}"
                                    th:value="${code.code}" th:text="${code.codeName}">스포일러</option>
                        </select>
                    </div>
                    <div class="mb-1">
                        <label for="rpDetail" class="form-label filter-bar">상세 내용 <span class="text-muted">(기타 사유는 필수)</span></label>
                        <textarea id="rpDetail" class="form-control" rows="3" maxlength="1000"
                                  placeholder="신고 사유를 구체적으로 적어 주세요."></textarea>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-end gap-1">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btnRpSave">신고</button>
                </div>
            </div>
        </div>
    </div>
    <!--//신고 모달-->

    <script th:src="@{/assets/js/comment/comment_list.js}" defer></script>
</div>
</body>
</html>
