<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}"
>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시목록</title>
</head>
<body>    
    <!--container-->
    <div layout:fragment="content" class="container py-2">
    <h3 class="display-7 mb-4 ">
        <i class="bi bi-modem"></i>
        게시글 목록
    </h3>        
           <!--검색조건-->
           <!--g-1: 모든 컬럼의 가로,세로 간격-->
           <form class="row g-1 mb-2">
                <div class="col-12 col-md-3">
                    <select name="searchDiv" id="searchDiv" class="form-select">
                        <option value="">전체</option>
                        <option value="10">제목</option>
                        <option value="20">내용</option>
                        <option value="30">내용+내용</option>
                    </select>
                </div>
                <div  class="col-12 col-md-3">
                    <input class="form-control"
                        name="searchWord"
                        id="searchWord"
                        placeholder="검색어를 입력 하세요"
                        type="search"
                    />
                </div>
                <div  class="col-12 col-md-3">
                    <select name="pageSize" id="pageSize" class="form-select">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>                    
                </div>

                <!--//검색조건-->
                <div class="col-12 col-md-3 d-flex justify-content-end gap-1">
                    <button class="btn btn-primary">검색</button>
                    <button class="btn btn-primary">등록</button>
                </div>                
           </form>
           <!--table-->
           <div class="table-responsive">
            <table  class="table table-sm table-striped table-hover table-bordered align-middle">
            <thead>
                <tr class="table-success text-center  text-nowrap">
                    <th scope="col">번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">작성자</th>
                    <th scope="col">등록일</th>
                    <th scope="col">조회수</th>
                </tr>
            </thead>   
            <tbody>
                <tr >
                    <th scope="row" class="text-center  text-nowrap">1</th>
                    <td class="text-start   text-nowrap">제목1 입니다.</td>
                    <td class="text-center   text-nowrap">이상무</td>
                    <td class="text-center   text-nowrap">2026/07/29</td>
                    <td class="text-end   text-nowrap">1</td>
                </tr>
                <tr>
                    <th scope="row" class="text-center   text-nowrap">2</th>
                    <td class="text-start   text-nowrap">Thymeleaf를 이용한 게시판 목록 화면 구현</td>
                    <td class="text-center   text-nowrap">이상무</td>
                    <td class="text-center   text-nowrap">2026/07/29</td>
                    <td class="text-end   text-nowrap">1</td>
                </tr>                
            </tbody>
            </table>   
           </div>
           <!--paging-->
            <nav aria-label="Page navigation example">
            <ul class="pagination justify-content-center">
                <li class="page-item">
                <a class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
                </li>
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                <a class="page-link" href="#" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
                </li>
            </ul>
            </nav>
            <!--//paging-->
    </div>   
    <!--//container-->
 
</body>
</html>
