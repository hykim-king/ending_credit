<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>인물 상세</title>
<script th:src="@{/assets/js/person/person-detail.js}" defer></script>
</head>
<body th:attr="data-person-id=${personId}">
<div layout:fragment="content">

    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

    <!-- P-01 프로필 영역 -->
    <section class="person-profile-card mb-4">
        <div class="d-flex flex-column flex-md-row gap-4 align-items-center align-items-md-start">
            <div class="person-profile-image-wrap">
                <img id="profileImage" class="person-profile-image d-none" alt="프로필 이미지">
                <div id="profilePlaceholder" class="person-profile-placeholder">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>
            <div class="flex-grow-1 text-center text-md-start">
                <p class="filter-bar text-muted mb-1">인물</p>
                <h1 id="personName" class="h2 fw-bold mb-1">불러오는 중...</h1>
                <p id="personNameOrg" class="text-secondary mb-0"></p>
            </div>
        </div>
    </section>

    <!-- 참여 작품 -->
    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0">참여 작품</h2>
            <span id="filmographyCount" class="filter-bar text-muted">0편</span>
        </div>

        <div id="filmographyEmpty" class="comment-card text-center text-muted py-5 d-none">
            등록된 참여 작품이 없습니다.
        </div>

        <div id="filmographyList" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3"></div>
    </section>

</div>
</body>
</html>
