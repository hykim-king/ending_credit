<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박스오피스 순</title>
<style>
    /* 진단용 화면이라 꾸밈은 최소로 두고, 무엇이 비었는지가 눈에 띄게 한다 */
    .diag-bar {
        background: #F7F6FA;
        border: 1px solid #E4E2E9;
        border-radius: 8px;
        padding: .75rem 1rem;
        font-size: .875rem;
    }
    /* 캐러셀 - detail.html 갤러리와 같은 골격(clip + track + translateX) */
    .shelf-viewport {
        position: relative;
    }
    .shelf-clip {
        overflow: hidden;
    }
    .shelf-track {
        display: flex;
        gap: 16px;
        transition: transform .3s ease;
    }
    /* 한 번에 5칸. 칸 사이 간격 4개(16px)를 뺀 나머지를 5등분한다 */
    .shelf-item {
        flex: 0 0 calc((100% - 64px) / 5);
    }
    .shelf-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        /* 접근성 원칙: 44px 터치 영역 */
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
        /* 버튼은 44px을 유지하고 아이콘만 작게 */
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 1;
        cursor: pointer;
        z-index: 2;
    }
    /* 본문 폭(1200px)밖으로 나가면 잘리므로 안쪽에 겹쳐 둔다 */
    .shelf-prev {
        left: 4px;
    }
    .shelf-next {
        right: 4px;
    }
    .shelf-nav:disabled {
        opacity: .3;
        cursor: default;
    }
    .shelf-nav:focus-visible, .movie-card:focus-visible {
        outline: 3px solid #D8D1FF;
    }

    .movie-card {
        display: block;
        color: inherit;
        text-decoration: none;
    }
    .movie-card img, .poster-empty {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 8px;
        background-color: #ECEAF2;
        display: block;
    }
    /* URL 자체가 없는 경우 */
    .poster-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6B6577;
        font-size: .8rem;
    }
    /* URL은 있는데 로딩에 실패한 경우 - 위와 구분되어야 원인을 가른다 */
    .poster-error {
        border: 2px solid #C0392B;
        background-color: #FDECEA;
    }
    .card-title {
        margin: .5rem 0 .15rem;
        font-size: .95rem;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .card-meta {
        margin: 0;
        font-size: .875rem;
        color: #5B5867;
    }
    /* 평소엔 감춰 두고, 이미지가 실패했을 때만 원인 파악용으로 드러낸다 */
    .card-url {
        margin: .25rem 0 0;
        font-size: .7rem;
        color: #8A8496;
        word-break: break-all;
    }
    .card-url[hidden] {
        display: none;
    }
</style>
</head>
<body>
    <div layout:fragment="content">

        <p th:if="${#lists.isEmpty(shelves)}" class="text-muted">
            조회 결과 0건입니다. 화면 문제가 아니라 CONTENT 적재를 먼저 확인해야 합니다.
        </p>

        <!-- 선반은 여기서 한 벌만 그린다. 줄을 늘리려면 컨트롤러에서 addShelf를 한 번 더 부르면 된다 -->
        <section class="mb-5" th:each="shelf : ${shelves}">

            <h5 class="mb-3">
                <span th:text="${shelf.title}">선반 제목</span>
                <small class="text-muted fw-normal" th:text="'(' + ${#lists.size(shelf.movies)} + '건)'">(0건)</small>
            </h5>

            <div class="shelf-viewport">
                <button type="button" class="shelf-nav shelf-prev" aria-label="이전">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <div class="shelf-clip">
                    <div class="shelf-track">
                        <div class="shelf-item" th:each="movie : ${shelf.movies}">
                            <a class="movie-card" th:href="@{/movies/{id}(id=${movie.contentId})}">

                                <!-- URL 없음(회색)과 로딩 실패(빨간 테두리)를 눈으로 구분한다 -->
                                <img th:if="${!#strings.isEmpty(movie.posterUrl)}"
                                     th:src="${movie.posterUrl}"
                                     th:alt="${movie.titleKo != null ? movie.titleKo : movie.titleOrg}"
                                     loading="lazy"
                                     onerror="this.classList.add('poster-error'); var u = this.parentNode.querySelector('.card-url'); if (u) { u.hidden = false; }">
                                <div th:if="${#strings.isEmpty(movie.posterUrl)}" class="poster-empty">URL 없음</div>

                                <p class="card-title"
                                   th:text="${movie.titleKo != null ? movie.titleKo : movie.titleOrg}">제목</p>

                                <!-- 연도는 매퍼가 YYYY-MM-DD로 내려주므로 앞 4자리만. 한쪽이 없으면 구분점도 지운다 -->
                                <p class="card-meta"
                                   th:with="year=${movie.releaseYear != null and #strings.length(movie.releaseYear) ge 4
                                                   ? #strings.substring(movie.releaseYear, 0, 4) : ''}">
                                    <span th:if="${!#strings.isEmpty(year)}" th:text="${year}">2024</span>
                                    <span th:if="${!#strings.isEmpty(year) and !#strings.isEmpty(movie.country)}"> · </span>
                                    <span th:if="${!#strings.isEmpty(movie.country)}" th:text="${movie.country}">국가</span>
                                </p>

                                <p class="card-url" hidden th:text="${movie.posterUrl}">posterUrl</p>
                            </a>
                        </div>
                    </div>
                </div>

                <button type="button" class="shelf-nav shelf-next" aria-label="다음">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>

        </section>

        <script>
            // 선반마다 독립 인스턴스로 돈다. detail.html의 갤러리 캐러셀은 querySelector 단일 전제라
            // 섹션이 여러 줄로 늘어나는 순간 첫 줄만 움직인다 - 그 함정을 여기서 피해 둔다
            document.addEventListener('DOMContentLoaded', function () {
                var VISIBLE_COUNT = 5;
                var GAP = 16;

                document.querySelectorAll('.shelf-viewport').forEach(function (shelf) {
                    var track = shelf.querySelector('.shelf-track');
                    var prevBtn = shelf.querySelector('.shelf-prev');
                    var nextBtn = shelf.querySelector('.shelf-next');
                    if (!track || !prevBtn || !nextBtn) {
                        return;
                    }

                    var items = track.children;
                    // 한 화면에 다 들어가면 화살표를 띄우지 않는다
                    if (items.length <= VISIBLE_COUNT) {
                        prevBtn.hidden = true;
                        nextBtn.hidden = true;
                        return;
                    }

                    var startIndex = 0;

                    function update() {
                        var itemWidth = items[0].getBoundingClientRect().width;
                        track.style.transform = 'translateX(-' + (startIndex * (itemWidth + GAP)) + 'px)';
                        prevBtn.disabled = startIndex === 0;
                        nextBtn.disabled = startIndex + VISIBLE_COUNT >= items.length;
                    }

                    prevBtn.addEventListener('click', function () {
                        startIndex = Math.max(0, startIndex - VISIBLE_COUNT);
                        update();
                    });
                    nextBtn.addEventListener('click', function () {
                        startIndex = Math.min(items.length - VISIBLE_COUNT, startIndex + VISIBLE_COUNT);
                        update();
                    });
                    // 창 크기가 바뀌면 칸 너비가 달라지므로 위치를 다시 계산한다
                    window.addEventListener('resize', update);

                    update();
                });
            });
        </script>

    </div>
</body>
</html>
