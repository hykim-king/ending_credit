<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{detail.section.collections}">이 작품이 담긴 컬렉션</title>
<!-- 카드는 상세와 같은 3조 목록 화면의 것을 쓴다(collection-list.js의 createCollectionCard) -->
<link rel="stylesheet" th:href="@{/assets/css/collection/collection-list.css}">
<script th:src="@{/assets/js/collection/collection-list.js}" defer></script>
<script th:src="@{/assets/js/common/collection-grid.js}" defer></script>
<style>
	.content-collections-head {
		display: flex;
		align-items: baseline;
		gap: 8px;
		margin-bottom: 24px;
	}
	/* 몇 개인지가 제목만큼 중요한 화면이라 브랜드색으로 세운다 */
	.content-collections-count {
		color: var(--endit-primary);
		font-weight: 700;
	}
	.content-collections-back {
		margin-left: auto;
		font-size: 14px;
	}
</style>
</head>
<body>
<div layout:fragment="content">

	<div th:if="${notFound}" class="container py-5">
		<p class="text-danger" th:text="#{detail.notFound}">해당 contentId의 데이터를 찾을 수 없습니다.</p>
	</div>

	<div th:unless="${notFound}" class="container py-4">

		<div class="content-collections-head">
			<h5 class="mb-0"
			    th:text="#{detail.collections.title(${@localeText.get(content.titleKo, content.titleOrg)})}">
				영화가 담긴 컬렉션</h5>
			<span class="content-collections-count" th:text="${collectionTotalCnt}">0</span>
			<a class="content-collections-back" th:href="@{/movies/{id}(id=${content.contentId})}"
			   th:text="${@localeText.get(content.titleKo, content.titleOrg)}">영화 상세</a>
		</div>

		<p th:if="${collections.isEmpty()}" class="text-muted"
		   th:text="#{detail.collections.empty}">아직 이 작품을 담은 컬렉션이 없습니다</p>

		<!-- 카드는 아래 스크립트가 채운다. 3열 격자는 컬렉션 목록 화면과 같은 CSS다 -->
		<div id="contentCollectionGrid" class="collection-card-grid" th:unless="${collections.isEmpty()}"></div>

		<!--
		  페이지 이동. 3조 목록 화면의 페이저는 그쪽 loadCollections에 묶여 있어 여기서는 서버가 그린다.
		  마지막 페이지는 전체 건수와 한 페이지 크기로 계산한다.
		-->
		<nav th:if="${collectionTotalCnt > pageSize}" class="mt-4" aria-label="pagination"
		     th:with="lastPage=${(collectionTotalCnt + pageSize - 1) / pageSize}">
			<ul class="pagination justify-content-center">
				<li class="page-item" th:classappend="${pageNo <= 1} ? 'disabled'">
					<!-- .disabled는 pointer-events만 없애 키보드로는 눌린다 - 탭 순서에서도 뺀다 -->
					<a class="page-link"
					   th:attr="tabindex=${pageNo <= 1} ? '-1' : null, aria-disabled=${pageNo <= 1} ? 'true' : null"
					   th:href="@{/movies/{id}/collections(id=${content.contentId},pageNo=${pageNo - 1})}"
					   th:text="#{home.carousel.prev}">이전</a>
				</li>
				<li class="page-item" th:each="page : ${#numbers.sequence(1, lastPage)}"
				    th:classappend="${page == pageNo} ? 'active'">
					<a class="page-link" th:attr="aria-current=${page == pageNo} ? 'page' : null"
					   th:href="@{/movies/{id}/collections(id=${content.contentId},pageNo=${page})}"
					   th:text="${page}">1</a>
				</li>
				<li class="page-item" th:classappend="${pageNo >= lastPage} ? 'disabled'">
					<a class="page-link"
					   th:attr="tabindex=${pageNo >= lastPage} ? '-1' : null, aria-disabled=${pageNo >= lastPage} ? 'true' : null"
					   th:href="@{/movies/{id}/collections(id=${content.contentId},pageNo=${pageNo + 1})}"
					   th:text="#{home.carousel.next}">다음</a>
				</li>
			</ul>
		</nav>

	</div>

	<script th:inline="javascript" th:unless="${notFound}">
		window.enditCollections = /*[[${collections}]]*/ [];
		window.enditCollectionMemberId = /*[[${loginMemberId}]]*/ 0;

		// collection-list.js가 defer라 그 다음에 돌아야 한다
		document.addEventListener("DOMContentLoaded", function () {
			window.enditCollectionGrid.fill(document.getElementById("contentCollectionGrid"));
		});
	</script>

</div>
</body>
</html>
