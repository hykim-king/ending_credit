<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/authLayout}">
<head>
    <title>ENDIT</title>
</head>
<body>

<div layout:fragment="content">

    <!-- 로고 -->
    <div class="mb-4">
        <a href="/" class="text-decoration-none fw-bold fs-4" style="color:#6550C8;">END IT</a>
    </div>

    <div class="card p-4">
        <h3 class="text-center mb-4">Google 계정으로 계속하기</h3>

        <!-- 서버에서 온 에러 (닉네임 중복 등으로 재렌더될 때) -->
        <div th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-danger"></div>

        <!-- 구글 계정 표시 (읽기 전용) -->
        <div class="rounded text-center p-3 mb-4" style="background:#f4f3f7;">
            <div class="text-muted" style="font-size:0.9em;">Google 계정</div>
            <div th:text="${email}">name@gmail.com</div>
        </div>

        <!-- 닉네임만 제출: 커맨드 객체 없이 @RequestParam nickname 으로 받음 -->
        <form action="/signup/oauth" method="post">

            <!-- 닉네임 + 중복확인 -->
            <div class="mb-3">
                <label class="form-label">닉네임 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="text" name="nickname" id="nickname" class="form-control" placeholder="2~15자">
                    <button type="button" id="checkNicknameBtn" class="btn btn-outline-secondary">중복 확인</button>
                </div>
                <div id="nicknameResult" style="font-size:0.9em"></div>
            </div>

            <!-- 안내 문구 -->
            <div class="text-center text-muted mb-3" style="font-size:0.9em;">
                기존 회원은 즉시 로그인<br>신규 회원만 닉네임을 입력
            </div>

            <!-- 가입 버튼 (막지 않고 항상 활성) -->
            <button type="submit" class="btn btn-primary w-100">가입 완료</button>

        </form>

    </div>

    <script>
        // 닉네임 중복 확인
        document.getElementById('checkNicknameBtn').addEventListener('click', async function() {
            const nickname = document.getElementById('nickname').value;
            const result = document.getElementById('nicknameResult');

            // 빈 값이면 입력 안내
            if (nickname.trim() === '') {
                result.textContent = '닉네임을 입력하세요';
                result.className = 'text-danger';
                return;
            }
            
            // 길이 먼저 검사 (2~15자) — 통과 못하면 서버에 물어보지 않음
            if (nickname.length < 2 || nickname.length > 15) {
                result.textContent = '닉네임은 2~15자여야 합니다';
                result.className = 'text-danger';
                return;
            }

            try {
                // {used: true} 면 이미 사용 중
                const data = await requestGet('/api/members/nickname-check', { nickname: nickname });
                if (data.used) {
                    result.textContent = '중복된 닉네임입니다';
                    result.className = 'text-danger';
                } else {
                    result.textContent = '사용 가능한 닉네임입니다';
                    result.className = 'text-success';
                }
            } catch (e) {
                result.textContent = e.message;
                result.className = 'text-danger';
            }
        });

        // 제출 시 닉네임 검증 (빈 값 / 2~15자)
        document.querySelector('form').addEventListener('submit', function(e) {
            const nicknameResult = document.getElementById('nicknameResult');
            const value = document.getElementById('nickname').value.trim();

            if (value === '') {
                nicknameResult.textContent = '닉네임을 입력하세요';
                nicknameResult.className = 'text-danger';
                e.preventDefault();
                return;
            }
            if (value.length < 2 || value.length > 15) {
                nicknameResult.textContent = '닉네임은 2~15자여야 합니다';
                nicknameResult.className = 'text-danger';
                e.preventDefault();
            }
        });
    </script>

</div>
</body>
</html>
