<!DOCTYPE html>
<!-- 로그인 메인 레이아웃(layout/layout) 데코레이트. G-02 헤더가 함께 렌더링됨. -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>마이페이지 - ENDIT</title>

    <!-- 마이페이지 전용 스타일 (인라인 style을 여기로 모음, 설계서 토큰 기준) -->
    <style>
        /* 디자인 토큰: Primary #6550C8 · Border #E4E2E9 · Radius 12·16 */
        .mypage {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        /* ── 프로필 헤더 ── */
        .mypage-head {
            display: flex;
            align-items: flex-start;   /* 소개가 여러 줄이어도 위쪽 기준 정렬 */
            gap: 20px;
            margin-bottom: 32px;
        }
        .mypage-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            background: #E4E2E9;
            flex-shrink: 0;
        }
        /* 이미지 없을 때 회색 원 안에 부트스트랩 아이콘 (팀 공통 bi-person-fill) */
        .mypage-avatar-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #E4E2E9;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 44px;
        }
        .mypage-name {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .mypage-intro {
            color: #6b7280;
            font-size: 15px;
            margin: 0;
            white-space: pre-wrap;    /* 줄바꿈 유지 */
            word-break: break-word;   /* 긴 단어도 줄바꿈 */
        }
        /* 설정 버튼: 소개가 길어도 찌그러지거나 줄바꿈되지 않게 */
        .mypage-head .btn {
            flex-shrink: 0;
            white-space: nowrap;
            align-self: center;   /* 버튼은 세로 가운데 유지 */
        }

        /* ── 기록 카운트 4종 (카드 그리드) ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }
        .stat-card {
            border: 1px solid #E4E2E9;
            border-radius: 16px;
            padding: 24px 12px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            background: #fff;
            transition: box-shadow .15s, border-color .15s;
        }
        .stat-card:hover {
            border-color: #D8D1FF;
            box-shadow: 0 4px 16px rgba(101, 80, 200, .08);
        }
        .stat-num {
            font-size: 26px;
            font-weight: 700;
            color: #6550C8;
            line-height: 1.2;
        }
        .stat-label {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ── 별점 분포 ── */
        .rating-box {
            border: 1px solid #E4E2E9;
            border-radius: 16px;
            padding: 28px 24px;
            margin-bottom: 40px;
        }
        .rating-box-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .rating-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 18px;
            height: 160px;
            margin-bottom: 20px;
        }
        .rating-bar-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            width: 44px;
        }
        .rating-bar-cnt {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .rating-bar {
            width: 100%;
            background: #6550C8;
            border-radius: 6px 6px 0 0;
            min-height: 4px;
            transition: height .3s;
        }
        .rating-bar-label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
        }
        .rating-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            border-top: 1px solid #E4E2E9;
            padding-top: 20px;
        }
        .rating-stat {
            text-align: center;
        }
        .rating-stat .num {
            font-size: 22px;
            font-weight: 700;
            color: #6550C8;
        }
        .rating-stat .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* ── 선호 장르 (취향 분석) ── */
        .genre-box {
            background: linear-gradient(135deg, #6550C8, #8b7ae0);
            border-radius: 16px;
            padding: 28px 24px;
            color: #fff;
        }
        .genre-comment {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .genre-ranks {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .genre-rank {
            font-size: 14px;
            background: rgba(255, 255, 255, .18);
            padding: 6px 14px;
            border-radius: 999px;
        }
        .genre-rank .cnt {
            font-weight: 700;
            margin-left: 4px;
        }

        /* ── 좋아요 섹션 ── */
        .likes-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .likes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: start;   /* 각 박스가 내용 높이만큼만 (인물 박스 아래 빈 공간 제거) */
        }
        .like-box {
            background: #F7F6FB;
            border: 1px solid #E4E2E9;
            border-radius: 16px;
            padding: 20px;
        }
        .like-box-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .like-box-head .title {
            font-weight: 600;
        }
        .like-box-head .more {
            color: #6550C8;
            font-size: 14px;
            text-decoration: none;
        }
        .like-list {
            display: flex;
            gap: 16px;
        }

        /* 인물 카드 */
        .person-item {
            text-align: center;
            text-decoration: none;
            color: inherit;
            flex: 1;
        }
        .person-item img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background: #E4E2E9;
        }
        .person-item .name {
            font-size: 14px;
            margin-top: 6px;
        }

        /* 컬렉션 카드 (2x2 포스터 콜라주) */
        .coll-item {
            text-decoration: none;
            color: inherit;
            flex: 1;
        }
        .coll-collage {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 10px;
            overflow: hidden;
            background: #E4E2E9;
        }
        .coll-collage .slot {
            background: #E4E2E9;   /* 포스터 없는 칸은 회색 */
            overflow: hidden;
        }
        .coll-collage .slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .coll-item .title {
            font-size: 14px;
            margin-top: 6px;
            text-align: center;
        }

        .likes-empty {
            color: #6b7280;
            font-size: 14px;
        }

        /* 반응형: 모바일에서 카운트 2열, 좋아요 1열 */
        @media (max-width: 767.98px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .likes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div layout:fragment="content">

    <div class="mypage" th:data-member-id="${memberId}">

        <!-- ===== 프로필 헤더 ===== -->
        <section class="mypage-head">
            <!-- 이미지 있으면 img, 없으면 아이콘. JS가 하나만 표시 -->
            <img id="profileImg" class="mypage-avatar d-none" alt="프로필 이미지">
            <span id="profileImgIcon" class="mypage-avatar-icon">
                <i class="bi bi-person-fill"></i>
            </span>
            <div class="flex-grow-1">
                <h2 id="nickname" class="mypage-name">&nbsp;</h2>
                <p id="introduction" class="mypage-intro"></p>
            </div>
            <!-- 설정: 모달 열기 (T-01) -->
            <button type="button" class="btn btn-outline-secondary"
                    data-bs-toggle="modal" data-bs-target="#settingsModal">설정</button>
        </section>

        <!-- ===== 기록 카운트 4종 ===== -->
        <section class="stats-grid">
            <a th:href="@{/members/me/records(tab='ratings')}" class="stat-card">
                <div id="ratingCnt" class="stat-num">0</div>
                <div class="stat-label">평가</div>
            </a>
            <a th:href="@{/members/me/records(tab='comments')}" class="stat-card">
                <div id="commentCnt" class="stat-num">0</div>
                <div class="stat-label">코멘트</div>
            </a>
            <a th:href="@{/members/me/records(tab='collections')}" class="stat-card">
                <div id="collectionCnt" class="stat-num">0</div>
                <div class="stat-label">컬렉션</div>
            </a>
            <a th:href="@{/members/me/records(tab='watchlist')}" class="stat-card">
                <div id="watchlistCnt" class="stat-num">0</div>
                <div class="stat-label">보고싶어요</div>
            </a>
        </section>

        <!-- ===== 별점 분포 ===== -->
        <section id="ratingSection" class="rating-box d-none">
            <div class="rating-box-title">별점 분포</div>
            <div class="rating-bars" id="ratingBars"></div>
            <div class="rating-stats">
                <div class="rating-stat">
                    <div class="num" id="ratingAvg">0.0</div>
                    <div class="label">별점 평균</div>
                </div>
                <div class="rating-stat">
                    <div class="num" id="ratingTotal">0</div>
                    <div class="label">별점 개수</div>
                </div>
                <div class="rating-stat">
                    <div class="num" id="ratingTop">-</div>
                    <div class="label">많이 준 별점</div>
                </div>
            </div>
        </section>

        <!-- ===== 선호 장르 (취향 분석) ===== -->
        <section id="genreSection" class="genre-box mb-5 d-none">
            <div class="genre-comment" id="genreComment"></div>
            <div class="genre-ranks" id="genreRanks"></div>
        </section>

        <!-- ===== 좋아요 ===== -->
        <h3 class="likes-title">좋아요</h3>
        <section class="likes-grid">

            <!-- 좋아한 인물 -->
            <div class="like-box">
                <a href="/members/me/likes?type=person" class="like-box-head">
                    <span class="title">좋아한 인물 <span id="personLikeCount">0</span>명</span>
                    <span class="more">›</span>
                </a>
                <div id="personLikeList" class="like-list"></div>
            </div>

            <!-- 좋아한 컬렉션 -->
            <div class="like-box">
                <a href="/members/me/likes?type=collection" class="like-box-head">
                    <span class="title">좋아한 컬렉션 <span id="collectionLikeCount">0</span>개</span>
                    <span class="more">›</span>
                </a>
                <div id="collectionLikeList" class="like-list"></div>
            </div>

        </section>

    </div>


    <!-- ============================================================
         T-01 설정 단일 모달
         중첩 모달 금지: 모달은 하나. 내부에서 .settings-panel 만 교체한다.
    ============================================================= -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:16px;">

          <div class="modal-header">
            <button type="button" id="settingsBackBtn" class="btn btn-link p-0 me-2 d-none"
                    aria-label="뒤로">‹</button>
            <h5 class="modal-title" id="settingsTitle">설정</h5>
            <button type="button" class="btn-close ms-auto"
                    data-bs-dismiss="modal" aria-label="닫기"></button>
          </div>

          <div class="modal-body">

            <!-- ===== 패널: 메뉴 ===== -->
            <div class="settings-panel" data-panel="menu">
              <div class="text-muted small mb-2">계정 설정</div>
              <button type="button" class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent settings-menu"
                      data-target="account">계정 정보 <span class="float-end text-muted">›</span></button>
              <button type="button" class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent settings-menu"
                      data-target="profile">프로필 수정 <span class="float-end text-muted">›</span></button>

              <hr>
              <div class="text-muted small mb-2">고객센터</div>
              <button type="button" class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent settings-menu"
                      data-target="support">문의하기 / FAQ <span class="float-end text-muted">›</span></button>
              <a href="#" target="_blank" rel="noopener noreferrer"
                 class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent d-block text-decoration-none text-dark">
                 DB 수정·추가 요청 <span class="float-end text-muted">↗</span></a>
              <a th:href="@{/notices}"
                 class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent d-block text-decoration-none text-dark">
                 공지사항 <span class="float-end text-muted">›</span></a>

              <hr>
              <button type="button" class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent settings-menu"
                      data-target="logout">로그아웃 <span class="float-end text-muted">›</span></button>
              <button type="button" class="list-group-item list-group-item-action w-100 text-start border-0 py-2 px-1 bg-transparent settings-menu text-danger"
                      data-target="withdraw">회원 탈퇴 <span class="float-end text-muted">›</span></button>
            </div>

            <!-- ===== 패널: 계정 정보 (T-03) ===== -->
            <div class="settings-panel d-none" data-panel="account">
              <div class="mb-3">
                <label class="form-label text-muted small mb-1">로그인 방식</label>
                <div id="acc-loginType">-</div>
              </div>
              <div class="mb-3">
                <label class="form-label text-muted small mb-1">이메일</label>
                <div id="acc-email">-</div>
              </div>
              <div id="acc-passwordArea">
                <hr>
                <div id="pw-msg" class="small mb-2"></div>
                <div class="mb-3">
                  <label class="form-label">현재 비밀번호 <span class="text-danger">*</span></label>
                  <input type="password" id="pw-current" class="form-control" placeholder="현재 비밀번호">
                </div>
                <div class="mb-3">
                  <label class="form-label">새 비밀번호 <span class="text-danger">*</span></label>
                  <input type="password" id="pw-new" class="form-control" placeholder="8자 이상">
                </div>
                <button type="button" id="pw-submit" class="btn btn-primary w-100">비밀번호 변경</button>
              </div>
              <p id="acc-socialNote" class="text-muted small d-none mb-0">
                Google 계정은 비밀번호 변경이 제공되지 않습니다.
              </p>
            </div>

            <!-- ===== 패널: 프로필 수정 (T-02) — 이미지 업로드 보류 ===== -->
            <div class="settings-panel d-none" data-panel="profile">
              <div class="d-flex align-items-center gap-3 mb-4">
                <img id="pf-img" class="d-none" alt="프로필 이미지"
                     style="width:56px; height:56px; border-radius:50%; object-fit:cover; background:#E4E2E9;">
                <span id="pf-img-icon"
                      style="width:56px; height:56px; border-radius:50%; background:#E4E2E9; display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px;">
                    <i class="bi bi-person-fill"></i>
                </span>
                <span class="text-muted small">이미지 변경은 추후 제공됩니다</span>
              </div>
              <div id="pf-msg" class="small mb-2"></div>
              <div class="mb-3">
                <label class="form-label">닉네임 <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input type="text" id="pf-nickname" class="form-control" placeholder="2~15자">
                  <button type="button" id="pf-checkNickname" class="btn btn-outline-secondary">중복 확인</button>
                </div>
                <div id="pf-nicknameResult" class="small mt-1"></div>
              </div>
              <div class="mb-3">
                <label class="form-label">소개</label>
                <textarea id="pf-introduction" class="form-control" rows="3"
                          maxlength="300" placeholder="자기소개를 입력하세요"></textarea>
                <div class="text-muted small mt-1 text-end"><span id="pf-introCount">0</span>/300</div>
              </div>
              <button type="button" id="pf-submit" class="btn btn-primary w-100">저장</button>
            </div>

            <!-- ===== 패널: 로그아웃 (T-07) ===== -->
            <div class="settings-panel d-none" data-panel="logout">
              <p class="mb-4">현재 계정에서 로그아웃할까요?</p>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary flex-fill settings-menu"
                        data-target="menu">취소</button>
                <form action="/logout" method="post" class="flex-fill">
                  <button type="submit" class="btn btn-primary w-100">로그아웃</button>
                </form>
              </div>
            </div>

            <!-- ===== 패널: 회원 탈퇴 (T-08) ===== -->
            <div class="settings-panel d-none" data-panel="withdraw">
              <p class="mb-2">탈퇴하면 프로필 접근이 중단되며 <span class="text-danger">복구할 수 없습니다.</span></p>
              <p class="text-muted small mb-3">회원 활동 데이터가 함께 삭제됩니다.</p>
              <div id="wd-msg" class="small mb-2"></div>
              <div class="mb-3">
                <label class="form-label">확인을 위해 닉네임 입력 <span class="text-danger">*</span></label>
                <input type="text" id="wd-confirm" class="form-control" placeholder="현재 닉네임">
              </div>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary flex-fill settings-menu"
                        data-target="menu">취소</button>
                <button type="button" id="wd-submit" class="btn btn-danger flex-fill" disabled>회원 탈퇴</button>
              </div>
            </div>

            <!-- 고객센터: 항목만 (내용 추후) -->
            <div class="settings-panel d-none" data-panel="support">
              <p class="text-muted mb-0">문의하기 / FAQ — 준비 중</p>
            </div>

          </div>
        </div>
      </div>
    </div>


    <script>
        // ===== 마이페이지 데이터 (CSR) =====
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            loadRatingDistribution();
            loadGenrePreference();
            loadPersonLikes();
            loadCollectionLikes();
            initSettingsModal();
        });

        async function loadProfile() {
            try {
                const res = await fetch('/api/members/me/account');
                if (!res.ok) return;
                const d = await res.json();

                document.getElementById('nickname').textContent = d.nickname ?? '';
                document.getElementById('introduction').textContent = d.introduction ?? '';
                // 이미지 있으면 img 표시, 없으면 아이콘 표시
                const img = document.getElementById('profileImg');
                const icon = document.getElementById('profileImgIcon');
                if (d.profileImgUrl) {
                    img.src = d.profileImgUrl;
                    img.classList.remove('d-none');
                    icon.classList.add('d-none');
                } else {
                    img.classList.add('d-none');
                    icon.classList.remove('d-none');
                }

                const s = d.stats ?? {};
                document.getElementById('ratingCnt').textContent     = s.ratingCnt ?? 0;
                document.getElementById('commentCnt').textContent    = s.commentCnt ?? 0;
                document.getElementById('collectionCnt').textContent = s.collectionCnt ?? 0;
                document.getElementById('watchlistCnt').textContent  = s.watchlistCnt ?? 0;
            } catch (e) {
                console.error('프로필 조회 실패', e);
            }
        }

        async function loadPersonLikes() {
            const list = document.getElementById('personLikeList');
            try {
                const res = await fetch('/api/members/me/likes/persons');
                if (!res.ok) return;
                const d = await res.json();
                document.getElementById('personLikeCount').textContent = d.totalCount ?? 0;
                if (!d.items || d.items.length === 0) {
                    list.innerHTML = '<p class="likes-empty">좋아한 인물이 없어요.</p>';
                    return;
                }
                list.innerHTML = d.items.map(p => `
                    <a href="/people/${p.personId}" class="person-item">
                        <img src="${resolveImg(p.profileImgUrl, 'w185')}" alt="">
                        <div class="name">${escapeHtml(p.nameKo || '')}</div>
                    </a>
                `).join('');
            } catch (e) {
                console.error('좋아한 인물 조회 실패', e);
            }
        }

        async function loadCollectionLikes() {
            const list = document.getElementById('collectionLikeList');
            try {
                const res = await fetch('/api/members/me/likes/collections');
                if (!res.ok) return;
                const d = await res.json();
                document.getElementById('collectionLikeCount').textContent = d.totalCount ?? 0;
                if (!d.items || d.items.length === 0) {
                    list.innerHTML = '<p class="likes-empty">좋아한 컬렉션이 없어요.</p>';
                    return;
                }
                list.innerHTML = d.items.map(c => {
                    // 포스터 4개를 뽑아 항상 4칸을 만든다. 없는 칸은 회색 빈칸(A안).
                    const posters = [
                        c.previewPosterUrl1, c.previewPosterUrl2,
                        c.previewPosterUrl3, c.previewPosterUrl4
                    ];
                    const slots = posters.map(p =>
                        p
                          ? `<span class="slot"><img src="${resolveImg(p, 'w185')}" alt=""></span>`
                          : `<span class="slot"></span>`   // 포스터 없으면 회색 빈칸
                    ).join('');

                    return `
                        <a href="/collections/${c.collectionId}" class="coll-item">
                            <div class="coll-collage">${slots}</div>
                            <div class="title">${escapeHtml(c.title || '')}</div>
                        </a>
                    `;
                }).join('');
            } catch (e) {
                console.error('좋아한 컬렉션 조회 실패', e);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }


        // ===== 별점 분포 =====
        async function loadRatingDistribution() {
            const section = document.getElementById('ratingSection');
            try {
                const res = await fetch('/api/members/me/rating-distribution');
                if (!res.ok) return;
                const d = await res.json();

                if (!d.total) return;   // 평가 없으면 섹션 숨김

                // 막대 높이는 최댓값 기준 비율로. dist = [1점,2점,3점,4점,5점]
                const dist = d.dist || [0,0,0,0,0];
                const max = Math.max(...dist, 1);   // 0으로 나눔 방지
                const bars = document.getElementById('ratingBars');
                bars.innerHTML = dist.map((cnt, i) => `
                    <div class="rating-bar-col">
                        <div class="rating-bar-cnt">${cnt > 0 ? cnt : ''}</div>
                        <div class="rating-bar" style="height:${(cnt / max) * 100}%"></div>
                        <div class="rating-bar-label">${i + 1}점</div>
                    </div>
                `).join('');

                document.getElementById('ratingAvg').textContent = d.average ?? '0.0';
                document.getElementById('ratingTotal').textContent = d.total ?? 0;
                document.getElementById('ratingTop').textContent = d.topScore ? d.topScore + '점' : '-';

                section.classList.remove('d-none');
            } catch (e) {
                console.error('별점 분포 조회 실패', e);
            }
        }


        // ===== 선호 장르 (취향 분석) =====

        // 장르별 멘트 (키는 GENRE.NAME 과 정확히 일치해야 함. TMDB 한국어 장르명 기준)
        const GENRE_COMMENTS = {
            "액션":      "심장 쫄깃, 액션 없인 못 살죠 💥",
            "모험":      "떠나는 게 인생, 모험 러버 🧭",
            "애니메이션": "동심을 잃지 않는 애니 마니아 🎨",
            "코미디":    "웃음이 최고의 힐링, 코미디 마니아 😆",
            "범죄":      "치밀한 두뇌 싸움, 범죄물 헌터 🕵️",
            "다큐멘터리": "진짜 이야기의 힘, 다큐 애호가 🎥",
            "드라마":    "삶의 깊이를 아는 드라마 애호가 🎭",
            "가족":      "따뜻함이 최고, 가족영화 러버 🏡",
            "판타지":    "상상의 세계로, 판타지 마니아 🧙",
            "역사":      "과거에서 배우는 히스토리 러버 📜",
            "공포":      "으슬으슬, 당신은 공포영화 매니아! 🔪",
            "음악":      "선율에 빠지는 뮤직 러버 🎵",
            "미스터리":  "수수께끼를 파헤치는 미스터리 헌터 🔍",
            "로맨스":    "설렘 충전 완료, 로맨스 러버 💕",
            "SF":        "상상은 무한대, SF 덕후 🚀",
            "TV 영화":   "안방극장 마니아 📺",
            "스릴러":    "긴장의 끈을 놓지 않는 스릴러 헌터 🎬",
            "전쟁":      "치열함 속의 드라마, 전쟁영화 애호가 ⚔️",
            "서부":      "황야의 낭만, 웨스턴 러버 🤠"
        };

        async function loadGenrePreference() {
            const section = document.getElementById('genreSection');
            try {
                const res = await fetch('/api/members/me/genre-preference');
                if (!res.ok) return;
                const d = await res.json();

                const topGenre = d.topGenre;
                // 평가한 영화가 없으면 섹션 자체를 숨김
                if (!topGenre) return;

                // 멘트: 매핑에 있으면 그 멘트, 없으면 기본 멘트
                const comment = GENRE_COMMENTS[topGenre] || `${topGenre} 애호가시군요! 🎬`;
                document.getElementById('genreComment').textContent = comment;

                // 상위 3개 장르 + 개수
                const top3 = (d.items || []).slice(0, 3);
                document.getElementById('genreRanks').innerHTML = top3.map(g => `
                    <span class="genre-rank">${escapeHtml(g.genreName)}<span class="cnt">${g.ratedCnt}</span></span>
                `).join('');

                section.classList.remove('d-none');   // 데이터 있을 때만 표시
            } catch (e) {
                console.error('선호 장르 조회 실패', e);
            }
        }

        // TMDB 이미지: 파일명 앞에 base URL을 붙인다.
        // 팀 공통 함수(UserListUi.resolveTmdbImageUrl)를 재사용해 base URL을 한 곳에서 관리한다.
        // 값이 없으면 기본 이미지로 대체.
        function resolveImg(path, size) {
            if (!path) return '/images/default-avatar.png';
            if (window.UserListUi && window.UserListUi.resolveTmdbImageUrl) {
                return window.UserListUi.resolveTmdbImageUrl(path, size);
            }
            // 공통 함수가 없을 때의 대비 (직접 조립)
            if (/^https?:\/\//i.test(path)) return path;
            return 'https://image.tmdb.org/t/p/' + size + path;
        }


        // ===== 설정 모달 =====
        function initSettingsModal() {
            const modalEl = document.getElementById('settingsModal');
            const titleEl = document.getElementById('settingsTitle');
            const backBtn = document.getElementById('settingsBackBtn');

            const titles = {
                menu: '설정', account: '계정 정보', profile: '프로필 수정',
                support: '문의하기 / FAQ', logout: '로그아웃', withdraw: '회원 탈퇴'
            };

            function showPanel(name) {
                modalEl.querySelectorAll('.settings-panel').forEach(p => {
                    p.classList.toggle('d-none', p.dataset.panel !== name);
                });
                titleEl.textContent = titles[name] ?? '설정';
                backBtn.classList.toggle('d-none', name === 'menu');

                if (name === 'account') loadAccount();
                if (name === 'profile') loadProfileForm();
                if (name === 'withdraw') initWithdrawPanel();
            }

            modalEl.querySelectorAll('.settings-menu').forEach(btn => {
                btn.addEventListener('click', () => showPanel(btn.dataset.target));
            });
            backBtn.addEventListener('click', () => showPanel('menu'));
            modalEl.addEventListener('show.bs.modal', () => showPanel('menu'));

            document.getElementById('pw-submit').addEventListener('click', changePassword);

            document.getElementById('pf-checkNickname').addEventListener('click', checkNicknameForProfile);
            document.getElementById('pf-submit').addEventListener('click', saveProfile);
            document.getElementById('pf-introduction').addEventListener('input', (e) => {
                document.getElementById('pf-introCount').textContent = e.target.value.length;
            });

            document.getElementById('wd-confirm').addEventListener('input', updateWithdrawButton);
            document.getElementById('wd-submit').addEventListener('click', withdraw);
        }

        // ── 프로필 수정 ──
        let originalNickname = '';
        let currentProfileImgUrl = null;

        async function loadProfileForm() {
            const msg = document.getElementById('pf-msg');
            msg.textContent = '';
            document.getElementById('pf-nicknameResult').textContent = '';
            try {
                const res = await fetch('/api/members/me/account');
                if (!res.ok) return;
                const d = await res.json();
                originalNickname = d.nickname ?? '';
                currentProfileImgUrl = d.profileImgUrl ?? null;
                document.getElementById('pf-nickname').value = originalNickname;
                document.getElementById('pf-introduction').value = d.introduction ?? '';
                document.getElementById('pf-introCount').textContent = (d.introduction ?? '').length;
                const pfImg = document.getElementById('pf-img');
                const pfIcon = document.getElementById('pf-img-icon');
                if (d.profileImgUrl) {
                    pfImg.src = d.profileImgUrl;
                    pfImg.classList.remove('d-none');
                    pfIcon.classList.add('d-none');
                } else {
                    pfImg.classList.add('d-none');
                    pfIcon.classList.remove('d-none');
                }
            } catch (e) {
                console.error('프로필 조회 실패', e);
            }
        }

        async function checkNicknameForProfile() {
            const result = document.getElementById('pf-nicknameResult');
            const nickname = document.getElementById('pf-nickname').value.trim();
            if (nickname === '') { setResult(result, '닉네임을 입력하세요', 'danger'); return; }
            if (nickname.length < 2 || nickname.length > 15) { setResult(result, '닉네임은 2~15자여야 합니다', 'danger'); return; }
            if (nickname === originalNickname) { setResult(result, '현재 사용 중인 닉네임입니다', 'muted'); return; }
            try {
                const data = await requestGet('/api/members/nickname-check', { nickname: nickname });
                if (data.used) setResult(result, '중복된 닉네임입니다', 'danger');
                else setResult(result, '사용 가능한 닉네임입니다', 'success');
            } catch (e) {
                setResult(result, e.message, 'danger');
            }
        }
        function setResult(el, text, kind) {
            el.textContent = text;
            el.className = 'small mt-1 text-' + kind;
        }

        async function saveProfile() {
            const nickname = document.getElementById('pf-nickname').value.trim();
            const introduction = document.getElementById('pf-introduction').value;
            if (nickname === '') { showPfMsg('닉네임을 입력하세요', true); return; }
            if (nickname.length < 2 || nickname.length > 15) { showPfMsg('닉네임은 2~15자여야 합니다', true); return; }
            if (introduction.length > 300) { showPfMsg('소개는 300자 이하여야 합니다', true); return; }
            try {
                const res = await fetch('/api/members/me/profile', {
                    method: 'PATCH',
                    headers: withCsrf({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ nickname, introduction, profileImgUrl: currentProfileImgUrl })
                });
                if (res.ok) {
                    showPfMsg('저장되었습니다.', false);
                    originalNickname = nickname;
                    document.getElementById('nickname').textContent = nickname;
                    document.getElementById('introduction').textContent = introduction;
                } else {
                    let text = '저장에 실패했습니다.';
                    try { const err = await res.json(); if (err && err.message) text = err.message; } catch (_) {}
                    showPfMsg(text, true);
                }
            } catch (e) {
                showPfMsg('저장 중 오류가 발생했습니다.', true);
            }
        }
        function showPfMsg(text, isError) {
            const msg = document.getElementById('pf-msg');
            msg.textContent = text;
            msg.className = 'small mb-2 ' + (isError ? 'text-danger' : 'text-success');
        }

        // ── 회원 탈퇴 ──
        let withdrawNickname = '';
        async function initWithdrawPanel() {
            document.getElementById('wd-msg').textContent = '';
            document.getElementById('wd-confirm').value = '';
            document.getElementById('wd-submit').disabled = true;
            if (originalNickname) { withdrawNickname = originalNickname; return; }
            try {
                const res = await fetch('/api/members/me/account');
                if (!res.ok) return;
                const d = await res.json();
                withdrawNickname = d.nickname ?? '';
            } catch (e) {
                console.error('닉네임 조회 실패', e);
            }
        }
        function updateWithdrawButton() {
            const input = document.getElementById('wd-confirm').value.trim();
            document.getElementById('wd-submit').disabled = (input !== withdrawNickname);
        }
        async function withdraw() {
            const msg = document.getElementById('wd-msg');
            const confirmNickname = document.getElementById('wd-confirm').value.trim();
            const btn = document.getElementById('wd-submit');
            btn.disabled = true;
            try {
                const res = await fetch('/api/members/me', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmNickname })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    let text = '탈퇴에 실패했습니다.';
                    try { const err = await res.json(); if (err && err.message) text = err.message; } catch (_) {}
                    msg.textContent = text;
                    msg.className = 'small mb-2 text-danger';
                    btn.disabled = false;
                }
            } catch (e) {
                msg.textContent = '탈퇴 중 오류가 발생했습니다.';
                msg.className = 'small mb-2 text-danger';
                btn.disabled = false;
            }
        }

        // ── 계정 정보 ──
        async function loadAccount() {
            document.getElementById('pw-msg').textContent = '';
            try {
                const res = await fetch('/api/members/me/account');
                if (!res.ok) return;
                const d = await res.json();
                const isGoogle = d.socialOnly === true;
                document.getElementById('acc-loginType').textContent = isGoogle ? 'Google' : 'Email';
                document.getElementById('acc-email').textContent = d.email ?? '-';
                document.getElementById('acc-passwordArea').classList.toggle('d-none', isGoogle);
                document.getElementById('acc-socialNote').classList.toggle('d-none', !isGoogle);
            } catch (e) {
                console.error('계정 정보 조회 실패', e);
            }
        }

        async function changePassword() {
            const current = document.getElementById('pw-current').value;
            const next = document.getElementById('pw-new').value;
            if (!current.trim()) { showPwMsg('현재 비밀번호를 입력하세요', true); return; }
            if (next.length < 8)  { showPwMsg('새 비밀번호는 8자 이상이어야 합니다', true); return; }
            try {
                const res = await fetch('/api/members/me/password', {
                    method: 'PATCH',
                    headers: withCsrf({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ currentPassword: current, newPassword: next })
                });
                if (res.ok) {
                    showPwMsg('비밀번호가 변경되었습니다.', false);
                    document.getElementById('pw-current').value = '';
                    document.getElementById('pw-new').value = '';
                } else {
                    let text = '변경에 실패했습니다.';
                    try { const err = await res.json(); if (err && err.message) text = err.message; } catch (_) {}
                    showPwMsg(text, true);
                }
            } catch (e) {
                showPwMsg('변경 중 오류가 발생했습니다.', true);
            }
        }
        function showPwMsg(text, isError) {
            const msg = document.getElementById('pw-msg');
            msg.textContent = text;
            msg.className = 'small mb-2 ' + (isError ? 'text-danger' : 'text-success');
        }

        // CSRF 헤더 헬퍼 (현재 CSRF 꺼져 있어 실질 영향 없음, 나중에 켤 때 대비)
        function withCsrf(headers) {
            const token  = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            if (token && header) headers[header] = token;
            return headers;
        }
    </script>
