<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>프로필 - ENDIT</title>
    <style>
        /* 디자인 토큰: Primary #6550C8 · Border #E4E2E9 · Radius 12·16 */
        .mypage {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        /* ── 프로필 헤더 ── */
        .mypage-head {
            display: flex;
            align-items: center;   /* 아바타와 이름·소개를 세로 가운데 정렬 */
            gap: 20px;
            margin-bottom: 32px;
        }
        .mypage-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            background: #E4E2E9;
            flex-shrink: 0;
        }
        /* 이미지 없을 때 회색 원 안에 부트스트랩 아이콘 (팀 공통 bi-person-fill) */
        .mypage-avatar-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #E4E2E9;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 44px;
        }
        .mypage-name {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 6px;
            line-height: 1.2;
        }
        .mypage-intro {
            color: #6b7280;
            font-size: 15px;
            margin: 0;
            line-height: 1.4;
            white-space: pre-wrap;    /* 줄바꿈 유지 */
            word-break: break-word;   /* 긴 단어도 줄바꿈 */
        }
        /* 이름+소개 묶음을 세로 가운데로 (아바타 중앙 높이에 이름이 오게) */
        .mypage-head .flex-grow-1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        /* 설정 버튼: 소개가 길어도 찌그러지거나 줄바꿈되지 않게 */
        .mypage-head .btn {
            flex-shrink: 0;
            white-space: nowrap;
            align-self: center;   /* 버튼은 세로 가운데 유지 */
        }

        /* ── 기록 카운트 4종 (카드 그리드) ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }
        .stat-card {
            border: 1px solid #E4E2E9;
            border-radius: 16px;
            padding: 24px 12px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            background: #fff;
            transition: box-shadow .15s, border-color .15s;
        }
        .stat-card:hover {
            border-color: #D8D1FF;
            box-shadow: 0 4px 16px rgba(101, 80, 200, .08);
        }
        .stat-num {
            font-size: 26px;
            font-weight: 700;
            color: #6550C8;
            line-height: 1.2;
        }
        .stat-label {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ── 별점 분포 ── */
        .rating-box {
            border: 1px solid #E4E2E9;
            border-radius: 16px;
            padding: 28px 24px;
            margin-bottom: 40px;
        }
        .rating-box-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .rating-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 18px;
            height: 160px;
            margin-bottom: 20px;
        }
        .rating-bar-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            width: 44px;
        }
        .rating-bar-cnt {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .rating-bar {
            width: 100%;
            background: #6550C8;
            border-radius: 6px 6px 0 0;
            min-height: 4px;
            transition: height .3s;
        }
        .rating-bar-label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
        }
        .rating-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            border-top: 1px solid #E4E2E9;
            padding-top: 20px;
        }
        .rating-stat {
            text-align: center;
        }
        .rating-stat .num {
            font-size: 22px;
            font-weight: 700;
            color: #6550C8;
        }
        .rating-stat .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* ── 선호 장르 (취향 분석) ── */
        .genre-box {
            background: linear-gradient(135deg, #6550C8, #8b7ae0);
            border-radius: 16px;
            padding: 28px 24px;
            color: #fff;
        }
        .genre-comment {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .genre-ranks {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .genre-rank {
            font-size: 14px;
            background: rgba(255, 255, 255, .18);
            padding: 6px 14px;
            border-radius: 999px;
        }
        .genre-rank .cnt {
            font-weight: 700;
            margin-left: 4px;
        }

        /* ── 좋아요 섹션 ── */
        .likes-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .likes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: start;   /* 각 박스가 내용 높이만큼만 (인물 박스 아래 빈 공간 제거) */
        }
        .like-box {
            background: #F7F6FB;
            border: 1px solid #E4E2E9;
            border-radius: 16px;
            padding: 20px;
        }
        .like-box-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            text-decoration: none;
            color: inherit;
        }
        .like-box-head .title {
            font-weight: 600;
        }
        .like-box-head:hover .title {
            color: #6550C8;
        }
        .like-list {
            display: flex;
            gap: 16px;
        }

        /* 인물 카드 */
        .person-item {
            text-align: center;
            text-decoration: none;
            color: inherit;
            flex: 1;
        }
        .person-item img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background: #E4E2E9;
        }
        .person-item .name {
            font-size: 14px;
            margin-top: 6px;
        }

        /* 컬렉션 카드 (2x2 포스터 콜라주) */
        .coll-item {
            text-decoration: none;
            color: inherit;
            flex: 1;
        }
        .coll-collage {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 10px;
            overflow: hidden;
            background: #E4E2E9;
        }
        .coll-collage .slot {
            background: #E4E2E9;   /* 포스터 없는 칸은 회색 */
            overflow: hidden;
        }
        .coll-collage .slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .coll-item .title {
            font-size: 14px;
            margin-top: 6px;
            text-align: center;
        }

        .likes-empty {
            color: #6b7280;
            font-size: 14px;
        }

        /* 반응형: 모바일에서 카운트 2열, 좋아요 1열 */
        @media (max-width: 767.98px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .likes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div layout:fragment="content">

    <div class="mypage" th:data-member-id="${memberId}">

        <!-- ===== 프로필 헤더 ===== -->
        <section class="mypage-head">
            <img id="profileImg" class="mypage-avatar d-none" alt="프로필 이미지">
            <span id="profileImgIcon" class="mypage-avatar-icon">
                <i class="bi bi-person-fill"></i>
            </span>
            <div class="flex-grow-1">
                <h2 id="nickname" class="mypage-name">&nbsp;</h2>
                <p id="introduction" class="mypage-intro"></p>
            </div>
        </section>

        <!-- ===== 기록 카운트 4종 ===== -->
        <section class="stats-grid">
            <a id="ratingTab" class="stat-card">
                <div id="ratingCnt" class="stat-num">0</div>
                <div class="stat-label">평가</div>
            </a>
            <a id="commentTab" class="stat-card">
                <div id="commentCnt" class="stat-num">0</div>
                <div class="stat-label">코멘트</div>
            </a>
            <a id="collectionTab" class="stat-card">
                <div id="collectionCnt" class="stat-num">0</div>
                <div class="stat-label">컬렉션</div>
            </a>
            <a id="watchlistTab" class="stat-card">
                <div id="watchlistCnt" class="stat-num">0</div>
                <div class="stat-label">보고싶어요</div>
            </a>
        </section>

        <!-- ===== 별점 분포 ===== -->
        <section id="ratingSection" class="rating-box d-none">
            <div class="rating-box-title">별점 분포</div>
            <p id="ratingEmpty" class="text-muted text-center d-none" style="margin-bottom:16px;">아직 평가한 영화가 없어요 ㅠㅠ</p>
            <div class="rating-bars" id="ratingBars"></div>
            <div class="rating-stats">
                <div class="rating-stat">
                    <div class="num" id="ratingAvg">0.0</div>
                    <div class="label">별점 평균</div>
                </div>
                <div class="rating-stat">
                    <div class="num" id="ratingTotal">0</div>
                    <div class="label">별점 개수</div>
                </div>
                <div class="rating-stat">
                    <div class="num" id="ratingTop">-</div>
                    <div class="label">많이 준 별점</div>
                </div>
            </div>
        </section>

        <!-- ===== 선호 장르 ===== -->
        <section id="genreSection" class="genre-box mb-5 d-none">
            <div class="genre-comment" id="genreComment"></div>
            <div class="genre-ranks" id="genreRanks"></div>
        </section>

        <!-- ===== 좋아요 ===== -->
        <h3 class="likes-title">좋아요</h3>
        <section class="likes-grid">
            <div class="like-box">
                <a class="like-box-head" th:href="@{/members/{id}/likes(id=${memberId}, type='person')}">
                    <span class="title">좋아한 인물 <span id="personLikeCount">0</span>명</span>
                </a>
                <div id="personLikeList" class="like-list"></div>
            </div>
            <div class="like-box">
                <a class="like-box-head" th:href="@{/members/{id}/likes(id=${memberId}, type='collection')}">
                    <span class="title">좋아한 컬렉션 <span id="collectionLikeCount">0</span>개</span>
                </a>
                <div id="collectionLikeList" class="like-list"></div>
            </div>
        </section>

    </div>

    <script>
        // 대상 회원 번호 (data 속성에서 읽음)
        const targetMemberId = document.querySelector('.mypage').dataset.memberId;

        document.addEventListener('DOMContentLoaded', () => {
            loadPublicProfile();
            loadRatingDistribution();
            loadGenrePreference();
            loadPersonLikes();
            loadCollectionLikes();
        });

        // 공개 프로필 + 기록 카운트
        async function loadPublicProfile() {
            try {
                const res = await fetch(`/api/members/${targetMemberId}`);
                if (!res.ok) return;
                const d = await res.json();

                document.getElementById('nickname').textContent = d.nickname ?? '';
                document.getElementById('introduction').textContent = d.introduction ?? '';
                const img = document.getElementById('profileImg');
                const icon = document.getElementById('profileImgIcon');
                if (d.profileImgUrl) {
                    img.src = d.profileImgUrl;
                    img.classList.remove('d-none');
                    icon.classList.add('d-none');
                } else {
                    img.classList.add('d-none');
                    icon.classList.remove('d-none');
                }

                const s = d.stats ?? {};
                document.getElementById('ratingCnt').textContent     = s.ratingCnt ?? 0;
                document.getElementById('commentCnt').textContent    = s.commentCnt ?? 0;
                document.getElementById('collectionCnt').textContent = s.collectionCnt ?? 0;
                document.getElementById('watchlistCnt').textContent  = s.watchlistCnt ?? 0;

                document.getElementById('ratingTab').href     = `/members/${targetMemberId}/records?tab=ratings`;
                document.getElementById('commentTab').href    = `/members/${targetMemberId}/records?tab=comments`;
                document.getElementById('collectionTab').href = `/members/${targetMemberId}/records?tab=collections`;
                document.getElementById('watchlistTab').href  = `/members/${targetMemberId}/records?tab=watchlist`;
            } catch (e) {
                console.error('공개 프로필 조회 실패', e);
            }
        }

        // 별점 분포
        async function loadRatingDistribution() {
            const section = document.getElementById('ratingSection');
            try {
                const res = await fetch(`/api/members/${targetMemberId}/rating-distribution`);
                if (!res.ok) return;
                const d = await res.json();

                section.classList.remove('d-none');   // 평가 없어도 섹션은 표시

                const dist = d.dist || [0,0,0,0,0];
                const total = d.total || 0;

                document.getElementById('ratingEmpty').classList.toggle('d-none', total > 0);

                const max = Math.max(...dist, 1);
                document.getElementById('ratingBars').innerHTML = dist.map((cnt, i) => `
                    <div class="rating-bar-col">
                        <div class="rating-bar-cnt">${cnt > 0 ? cnt : ''}</div>
                        <div class="rating-bar" style="height:${(cnt / max) * 100}%"></div>
                        <div class="rating-bar-label">${i + 1}점</div>
                    </div>
                `).join('');

                document.getElementById('ratingAvg').textContent = d.average ?? '0.0';
                document.getElementById('ratingTotal').textContent = total;
                document.getElementById('ratingTop').textContent = d.topScore ? d.topScore + '점' : '-';
            } catch (e) {
                console.error('별점 분포 조회 실패', e);
            }
        }

        // 선호 장르 멘트 매핑
        const GENRE_COMMENTS = {
            "액션":      "몸이 먼저 반응하는 액션 러버 💥",
            "모험":      "떠나는 게 인생, 모험 러버 🧭",
            "애니메이션": "동심을 잃지 않는 애니 마니아 🎨",
            "코미디":    "웃음이 최고의 힐링, 코미디 마니아 😆",
            "범죄":      "치밀한 두뇌 싸움, 범죄물 헌터 🕵️",
            "다큐멘터리": "진짜 이야기의 힘, 다큐 애호가 🎥",
            "드라마":    "삶의 깊이를 아는 드라마 애호가 🎭",
            "가족":      "따뜻함이 최고, 가족영화 러버 🏡",
            "판타지":    "상상의 세계로, 판타지 마니아 🧙",
            "역사":      "과거에서 배우는 히스토리 러버 📜",
            "공포":      "으슬으슬, 당신은 공포영화 매니아! 🔪",
            "음악":      "선율에 빠지는 뮤직 러버 🎵",
            "미스터리":  "수수께끼를 파헤치는 미스터리 헌터 🔍",
            "로맨스":    "설렘 충전 완료, 로맨스 러버 💕",
            "SF":        "상상은 무한대, SF 덕후 🚀",
            "TV 영화":   "안방극장 마니아 📺",
            "스릴러":    "긴장의 끈을 놓지 않는 스릴러 헌터 🎬",
            "전쟁":      "치열함 속의 드라마, 전쟁영화 애호가 ⚔️",
            "서부":      "황야의 낭만, 웨스턴 러버 🤠"
        };

        async function loadGenrePreference() {
            const section = document.getElementById('genreSection');
            try {
                const res = await fetch(`/api/members/${targetMemberId}/genre-preference`);
                if (!res.ok) return;
                const d = await res.json();
                const topGenre = d.topGenre;
                section.classList.remove('d-none');   // 항상 표시

                if (!topGenre) {
                    document.getElementById('genreComment').textContent = '당신의 취향은 아직 미스터리 🎬';
                    document.getElementById('genreRanks').innerHTML = '';
                    return;
                }

                const comment = GENRE_COMMENTS[topGenre] || `${topGenre} 애호가시군요! 🎬`;
                document.getElementById('genreComment').textContent = comment;

                const top3 = (d.items || []).slice(0, 3);
                document.getElementById('genreRanks').innerHTML = top3.map(g => `
                    <span class="genre-rank">${escapeHtml(g.genreName)}<span class="cnt">${g.ratedCnt}</span></span>
                `).join('');
            } catch (e) {
                console.error('선호 장르 조회 실패', e);
            }
        }

        // 좋아한 인물 미리보기
        async function loadPersonLikes() {
            const list = document.getElementById('personLikeList');
            try {
                const res = await fetch(`/api/members/${targetMemberId}/likes/persons`);
                if (!res.ok) return;
                const d = await res.json();
                document.getElementById('personLikeCount').textContent = d.totalCount ?? 0;
                if (!d.items || d.items.length === 0) {
                    list.innerHTML = '<p class="likes-empty">좋아한 인물이 없어요.</p>';
                    return;
                }
                list.innerHTML = d.items.map(p => `
                    <a href="/people/${p.personId}" class="person-item">
                        <img src="${resolveImg(p.profileImgUrl, 'w185')}" alt="">
                        <div class="name">${escapeHtml(p.nameKo || '')}</div>
                    </a>
                `).join('');
            } catch (e) {
                console.error('좋아한 인물 조회 실패', e);
            }
        }

        // 좋아한 컬렉션 미리보기 (2x2 콜라주)
        async function loadCollectionLikes() {
            const list = document.getElementById('collectionLikeList');
            try {
                const res = await fetch(`/api/members/${targetMemberId}/likes/collections`);
                if (!res.ok) return;
                const d = await res.json();
                document.getElementById('collectionLikeCount').textContent = d.totalCount ?? 0;
                if (!d.items || d.items.length === 0) {
                    list.innerHTML = '<p class="likes-empty">좋아한 컬렉션이 없어요.</p>';
                    return;
                }
                list.innerHTML = d.items.map(c => {
                    const posters = [c.previewPosterUrl1, c.previewPosterUrl2, c.previewPosterUrl3, c.previewPosterUrl4];
                    const slots = posters.map(p =>
                        p ? `<span class="slot"><img src="${resolveImg(p, 'w185')}" alt=""></span>`
                          : `<span class="slot"></span>`
                    ).join('');
                    return `
                        <a href="/collections/${c.collectionId}" class="coll-item">
                            <div class="coll-collage">${slots}</div>
                            <div class="title">${escapeHtml(c.title || '')}</div>
                        </a>
                    `;
                }).join('');
            } catch (e) {
                console.error('좋아한 컬렉션 조회 실패', e);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // TMDB 이미지 base URL 처리 (팀 공통 함수 우선)
        function resolveImg(path, size) {
            if (!path) return '/images/default-avatar.png';
            if (window.UserListUi && window.UserListUi.resolveTmdbImageUrl) {
                return window.UserListUi.resolveTmdbImageUrl(path, size);
            }
            if (/^https?:\/\//i.test(path)) return path;
            return 'https://image.tmdb.org/t/p/' + size + path;
        }
    </script>

</div>
</body>
</html>
